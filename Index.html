function renderIncTable() {
  const d = STATE.d, all = d.inc, start = Math.max(0, all.length - SHOW_Q), cur = d.currency, mode = STATE.incMode;
  const cols = all.slice(start).map((r, k) => ({ r, i: start + k }));
  const rows = [
    ["Revenue", "revenue", "strong"], ["Cost of revenue", "costOfRevenue", "sub"], ["Gross profit", "grossProfit", "strong"],
    ["R&D", "researchAndDevelopmentExpenses", "sub"], ["SG&A", "sellingGeneralAndAdministrativeExpenses", "sub"], ["Total operating expenses", "operatingExpenses", ""],
    ["Operating income", "operatingIncome", "strong"], ["EBITDA", "ebitda", ""], ["Interest expense", "interestExpense", "sub"],
    ["Pre-tax income", "incomeBeforeTax", ""], ["Income tax", "incomeTaxExpense", "sub"], ["Net income", "netIncome", "strong"],
    ["Diluted EPS", "epsDiluted", "", "eps"], ["Diluted shares", "weightedAverageShsOutDil", "", "shares"]
  ];
  const marginRows = [["Gross margin", "gm"], ["Operating margin", "om"], ["Net margin", "nm"], ["Effective tax rate", "taxRate"]];
  const cell = (v, html) => `<td class="${!isNum(v) ? "na" : ""}">${html}</td>`;
  let h = `<table><thead><tr><th>${esc(cur)}</th>${cols.map(c => `<th>${esc(c.r.label)}<br><span style="font-weight:400">${esc(c.r.date)}</span></th>`).join("")}</tr></thead><tbody>`;
  rows.forEach(([name, f, k, kind]) => {
    if (cols.every(c => !c.r[f])) return;
    h += `<tr class="${k}"><td>${name}</td>`;
    cols.forEach(({ r, i }) => {
      const v = r[f];
      if (mode === "values") h += cell(v, kind === "eps" ? (isNum(v) ? v.toFixed(2) : "—") : kind === "shares" ? (isNum(v) ? (v / 1e6).toFixed(0) + "M" : "—") : money(v, cur));
      else if (mode === "pct") { const x = kind ? null : ratio(v, r.revenue); h += cell(x, pctPlain(x)); }
      else {
        const j = mode === "yoy" ? yearAgoIdx(all, i) : i - 1;
        const x = j >= 0 ? growth(v, all[j][f]) : null;
        h += `<td class="${isNum(x) ? cls(x) : "na"}">${pct(x)}</td>`;
      }
    });
    h += `</tr>`;
  });
  h += `<tr class="grp"><td colspan="${cols.length + 1}">${mode === "values" || mode === "pct" ? "Margins" : "Margin change (" + (mode === "yoy" ? "YoY" : "QoQ") + ")"}</td></tr>`;
  marginRows.forEach(([name, f]) => {
    h += `<tr><td>${name}</td>`;
    cols.forEach(({ r, i }) => {
      if (mode === "values" || mode === "pct") h += cell(r[f], pctPlain(r[f]));
      else { const j = mode === "yoy" ? yearAgoIdx(all, i) : i - 1; const x = j >= 0 && isNum(r[f]) && isNum(all[j][f]) ? r[f] - all[j][f] : null; h += `<td class="${isNum(x) ? (f === "taxRate" ? "" : cls(x)) : "na"}">${bps(x)}</td>`; }
    });
    h += `</tr>`;
  });
  h += `</tbody></table>`;
  document.getElementById("incTable").innerHTML = h;
}

function growthSection(d) {
  const mode = MODE(), cur = d.currency;
  const anyAnnual = [d.seg, d.geo].some(x => x && x.mode !== "quarter");
  const anyQuarter = [d.seg, d.geo].some(x => x && x.mode === "quarter");
  const note = (d.seg && d.seg.qNote) || (d.geo && d.geo.qNote) || "";
  let banner = "";
  const which = d.seg && d.seg.mode !== "quarter" ? (d.geo && d.geo.mode !== "quarter" ? "by segment and region" : "by segment") : "by region";
  if (anyAnnual && mode === "qoq") banner = `<div class="banner"><b>QoQ ${which} isn't available for this ticker on your data plan.</b> Financial Modeling Prep only returned annual segment figures${note ? ` (it said: “${esc(note.slice(0, 160))}”)` : ""}, so ${anyQuarter ? "that part compares" : "this section compares"} each fiscal year with the one before. Company-level revenue above is still quarterly. If quarterly segment data comes back, QoQ shows here automatically.</div>`;
  else if (anyAnnual) banner = `<div class="banner"><b>Annual figures ${which}.</b> Each fiscal year is compared with the one before, since quarterly ${which.replace("by ", "")} data isn't available on your plan.</div>`;
  return `<section class="sec" id="seggrowth">
    <div class="sec-h"><div><span class="eyebrow">Revenue growth by product and segment</span><h2>Where the growth came from</h2>
      <p>How much each business unit and region added to or took away from revenue, its % change, and how many percentage points of total growth it accounts for.</p></div></div>
    ${banner}
    ${growthBlock(d.seg, "seg", "By business unit", cur)}
    ${growthBlock(d.geo, "geo", "By region", cur)}
  </section>`;
}

function growthBlock(seg, id, title, cur) {
  if (!seg) return `<div class="gblock"><div class="ghead"><h3>${esc(title)}</h3></div><p class="status">No ${id === "geo" ? "regional" : "segment"} breakdown is available for this company from Financial Modeling Prep.</p></div>`;
  const mode = MODE();
  // periods that have a comparison available
  const valid = seg.rows.map((r, i) => i).filter(i => segCmpIdx(seg, i, mode) >= 0);
  if (!valid.length) return "";
  let sel = STATE.segSel[id];
  if (!valid.includes(sel)) sel = valid[valid.length - 1];
  const sa = segmentAnalysis(seg, mode, sel);
  if (!sa) return "";
  const colors = {}; seg.names.forEach((n, i) => colors[n] = PAL[i % PAL.length]);
  const w = sa.cmpLabel;

  /* headline */
  const head = `<div class="gsum"><span class="big ${cls(sa.totGrowth)}">${pct(sa.totGrowth)}</span>
    <span class="cap">Total ${id === "geo" ? "regional" : "segment"} revenue ${w}: <b>${money(sa.totPrev, cur)}</b> in ${esc(sa.prev.label)} → <b>${money(sa.totCur, cur)}</b> in ${esc(sa.cur.label)}, a change of <b class="${cls(sa.dTot)}">${money(sa.dTot, cur).replace(/^(?!−)/, sa.dTot > 0 ? "+" : "")}</b>.</span></div>`;

  /* growth bridge */
  let steps = sa.items.filter(i => isNum(i.delta)).sort((a, b) => b.delta - a.delta);
  if (steps.length > 9) {
    const keep = [...steps].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta)).slice(0, 8).map(i => i.name);
    const rest = steps.filter(i => !keep.includes(i.name));
    const rd = rest.reduce((t, i) => t + i.delta, 0), rp = rest.reduce((t, i) => t + n0(i.prev), 0);
    steps = steps.filter(i => keep.includes(i.name)).concat([{ name: `Other (${rest.length})`, delta: rd, chg: growth(rp + rd, rp), contribPP: sa.totPrev ? rd / sa.totPrev : null, other: true }]).sort((a, b) => b.delta - a.delta);
  }
  let cum = sa.totPrev;
  steps = steps.map(s => { const a = cum; cum += s.delta; return Object.assign({}, s, { a, b: cum }); });
  const pts = [sa.totPrev, sa.totCur, ...steps.flatMap(s => [s.a, s.b])];
  let lo = Math.min(...pts), hi = Math.max(...pts);
  const span = (hi - lo) || Math.abs(hi) * 0.05 || 1;
  lo = Math.max(0, lo - span * 0.8); hi = hi + span * 0.08;
  const X = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const totRow = (lab, v) => `<div class="br tot"><span class="nm">${esc(lab)}</span><span class="track"><i style="left:0;width:${X(v)}%;background:var(--neu)"></i></span><span class="vals">${money(v, cur)}</span></div>`;
  const bridge = `<div class="panel"><h4>Growth bridge <small>${esc(sa.prev.label)} → ${esc(sa.cur.label)}${lo > 0 ? ` · axis starts at ${money(lo, cur)}` : ""}</small></h4>
    <div class="bridge">
      ${totRow(sa.prev.label + " total", sa.totPrev)}
      ${steps.map(s => `<div class="br" title="${esc(s.name)}: ${money(s.delta, cur)} (${pct(s.chg)})"><span class="nm">${s.other ? "" : `<span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:${colors[s.name]}"></span>`}${esc(s.name)}</span>
        <span class="track"><i style="left:${X(Math.min(s.a, s.b))}%;width:${Math.max(0.6, Math.abs(X(s.b) - X(s.a)))}%;background:var(${s.delta >= 0 ? "--pos" : "--neg"})"></i></span>
        <span class="vals"><span class="${cls(s.delta)}">${money(s.delta, cur).replace(/^(?!−)/, s.delta > 0 ? "+" : "")}</span><b class="${cls(s.chg)}">${s.isNew ? "new" : pct(s.chg)}</b></span></div>`).join("")}
      ${totRow(sa.cur.label + " total", sa.totCur)}
    </div></div>`;

  /* mix chart: last periods, annotated with growth in the chosen mode */
  const shown = seg.rows.slice(-(seg.mode === "quarter" ? SHOW_Q : 5));
  const series = seg.names.map(n => ({ name: n, color: colors[n], values: shown.map(r => r.data[n]) }));
  const totG = shown.map(r => { const i = seg.rows.indexOf(r), j = segCmpIdx(seg, i, mode); if (j < 0) return null; const t = x => seg.names.reduce((s2, n) => s2 + n0(x.data[n]), 0); return growth(t(r), t(seg.rows[j])); });
  const mixChart = `<div class="panel"><h4>Revenue mix <small>total ${w} % above bars</small></h4>${legend(series)}<div class="chart">${barChart(shown.map(r => r.label), series, { stacked: true, annot: totG, fmt: v => money(v, cur), title: title + " revenue" })}</div></div>`;

  /* detail table */
  const maxAbs = Math.max(0.01, ...sa.items.map(i => Math.abs(n0(i.chg))));
  const dbar = v => isNum(v) ? `<span class="dbar"><i style="${v >= 0 ? `left:50%;width:${Math.min(50, v / maxAbs * 50)}%` : `right:50%;width:${Math.min(50, -v / maxAbs * 50)}%`};background:var(${v >= 0 ? "--pos" : "--neg"})"></i></span>` : "";
  const rowsSorted = [...sa.items].sort((a, b) => n0(b.cur) - n0(a.cur));
  const table = `<div class="tbl"><table><thead><tr><th>${id === "geo" ? "Region" : "Segment"}</th><th>${esc(sa.prev.label)}</th><th>${esc(sa.cur.label)}</th><th>$ change</th><th>% change ${esc(w)}</th><th></th><th title="Percentage points of total revenue growth this segment accounts for">Contribution to growth</th><th>Share of revenue</th><th>Share Δ</th></tr></thead><tbody>
    ${rowsSorted.map(it => `<tr><td><span class="sw" style="background:${colors[it.name]}"></span>${esc(it.name)}</td><td>${money(it.prev, cur)}</td><td>${money(it.cur, cur)}</td>
      <td class="${cls(it.delta)}">${isNum(it.delta) ? money(it.delta, cur).replace(/^(?!−)/, it.delta > 0 ? "+" : "") : "—"}</td>
      <td class="big ${cls(it.chg)}">${it.isNew ? "new" : pct(it.chg)}</td><td>${dbar(it.chg)}</td>
      <td class="${cls(it.contribPP)}">${pp(it.contribPP)}</td><td>${pctPlain(it.share)}</td><td class="${cls(it.shareChg)}">${pp(it.shareChg)}</td></tr>`).join("")}
    <tr class="strong"><td>Total</td><td>${money(sa.totPrev, cur)}</td><td>${money(sa.totCur, cur)}</td><td class="${cls(sa.dTot)}">${money(sa.dTot, cur).replace(/^(?!−)/, sa.dTot > 0 ? "+" : "")}</td>
      <td class="big ${cls(sa.totGrowth)}">${pct(sa.totGrowth)}</td><td>${dbar(sa.totGrowth)}</td><td class="${cls(sa.totGrowth)}">${pp(sa.totGrowth)}</td><td>100%</td><td></td></tr>
  </tbody></table></div>`;

  /* history heat table */
  const histIdx = valid.slice(-(seg.mode === "quarter" ? SHOW_Q : 5));
  const tot = x => seg.names.reduce((s2, n) => s2 + n0(x.data[n]), 0);
  const heat = v => { if (!isNum(v)) return ""; const a = Math.min(1, Math.abs(v) / (mode === "qoq" && seg.mode === "quarter" ? 0.15 : 0.25)); return `background:color-mix(in srgb, var(${v >= 0 ? "--pos" : "--neg"}) ${Math.round(8 + a * 40)}%, transparent)`; };
  const hist = `<div class="panel"><h4>${esc(w)} % change history <small>darker = bigger move</small></h4><div class="tbl heat"><table><thead><tr><th>${id === "geo" ? "Region" : "Segment"}</th>${histIdx.map(i => `<th>${esc(seg.rows[i].label)}</th>`).join("")}</tr></thead><tbody>
    ${seg.names.map(n => `<tr><td><span class="sw" style="background:${colors[n]}"></span>${esc(n)}</td>${histIdx.map(i => { const v = growth(seg.rows[i].data[n], seg.rows[segCmpIdx(seg, i, mode)].data[n]); return `<td class="${cls(v)}" style="${heat(v)}">${pct(v)}</td>`; }).join("")}</tr>`).join("")}
    <tr class="strong"><td>Total</td>${histIdx.map(i => { const v = growth(tot(seg.rows[i]), tot(seg.rows[segCmpIdx(seg, i, mode)])); return `<td class="${cls(v)}" style="${heat(v)}">${pct(v)}</td>`; }).join("")}</tr>
  </tbody></table></div></div>`;

  const picker = `<label class="note">Period <select data-sel="${id}" id="sel-${id}">${valid.slice().reverse().map(i => `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(seg.rows[i].label)} vs ${esc(seg.rows[segCmpIdx(seg, i, mode)].label)}</option>`).join("")}</select></label>`;
  const marg = id === "seg" ? `<p class="note">Segment margins and costs aren't in Financial Modeling Prep's data (it reports revenue by segment only). Where a company discloses segment operating income, it's in the segment note of the 10-Q/10-K.</p>` : "";
  return `<div class="gblock" id="g-${id}">
    <div class="ghead"><h3>${esc(title)} <span class="eyebrow" style="margin-left:6px">${seg.mode === "quarter" ? "quarterly" : "annual"} · ${esc(w)}</span></h3>${picker}</div>
    ${head}
    <div class="grid2">${bridge}${mixChart}</div>
    ${table}
    ${hist}
    ${marg}
  </div>`;
}

function bsSection(d, cur) {
  const b = d.bs; if (!b.length) return `<p class="status">No balance sheet data.</p>`;
  const n = b.length, L = b[n - 1], P = b[n - 2], Y = n >= 5 ? b[n - 5] : null;
  const derive = r => r && Object.assign(r, {
    _cash: n0(r.cashAndShortTermInvestments), _wc: n0(r.totalCurrentAssets) - n0(r.totalCurrentLiabilities),
    _cr: ratio(r.totalCurrentAssets, r.totalCurrentLiabilities), _de: ratio(r.totalDebt, r.totalStockholdersEquity)
  });
  [L, P, Y].forEach(derive);
  const A = L.totalAssets || 1;
  const assets = [
    ["Cash & ST investments", L.cashAndShortTermInvestments, "var(--c1)"],
    ["Receivables", L.netReceivables, "var(--c7)"],
    ["Inventory", L.inventory, "var(--c2)"],
    ["Other current", n0(L.totalCurrentAssets) - n0(L.cashAndShortTermInvestments) - n0(L.netReceivables) - n0(L.inventory), "var(--c8)"],
    ["PP&E", L.propertyPlantEquipmentNet, "var(--c3)"],
    ["LT investments", L.longTermInvestments, "var(--c6)"],
    ["Goodwill & intangibles", L.goodwillAndIntangibleAssets, "var(--c4)"],
    ["Other non-current", n0(L.totalNonCurrentAssets) - n0(L.propertyPlantEquipmentNet) - n0(L.longTermInvestments) - n0(L.goodwillAndIntangibleAssets), "var(--c5)"]
  ];
  const eq = n0(L.totalEquity ?? L.totalStockholdersEquity);
  const fund = [
    ["Current liabilities", n0(L.totalCurrentLiabilities) , "var(--c5)"],
    ["Long-term debt", L.longTermDebt, "var(--c2)"],
    ["Other liabilities", n0(L.totalLiabilities) - n0(L.totalCurrentLiabilities) - n0(L.longTermDebt), "var(--c8)"],
    ["Equity", Math.max(0, eq), "var(--c1)"]
  ];
  const stack = items => items.filter(([, v]) => n0(v) > 0).map(([lab, v, c]) => `<div style="flex:${n0(v) / A};background:${c}" title="${esc(lab)}: ${money(v, cur)}">${n0(v) / A > 0.06 ? `<span>${esc(lab)}</span><span>${pctPlain(n0(v) / A, 0)}</span>` : ""}</div>`).join("");
  const map = `<div class="panel"><h4>Balance sheet map <small>${esc(L.label)} · total assets ${money(L.totalAssets, cur)}</small></h4>
    <div class="bsmap"><div class="bscol"><span class="lbl"><span>Assets</span></span><div class="stack">${stack(assets)}</div></div>
    <div class="bscol"><span class="lbl"><span>Liabilities + equity</span></span><div class="stack">${stack(fund)}</div></div></div>
    ${legend([...assets, ...fund].filter(([, v]) => n0(v) > 0).map(([name, , color]) => ({ name, color })))}
    ${eq < 0 ? `<p class="note">Shareholders' equity is negative (${money(eq, cur)}), usually from buybacks exceeding retained earnings, so it isn't drawn.</p>` : ""}</div>`;
  const rows = [
    ["grp", "Assets"], ["Cash & ST investments", "cashAndShortTermInvestments"], ["Receivables", "netReceivables"], ["Inventory", "inventory"],
    ["Total current assets", "totalCurrentAssets", "strong"], ["PP&E (net)", "propertyPlantEquipmentNet"], ["Long-term investments", "longTermInvestments"],
    ["Goodwill & intangibles", "goodwillAndIntangibleAssets"], ["Total assets", "totalAssets", "strong"],
    ["grp", "Liabilities"], ["Accounts payable", "accountPayables"], ["Deferred revenue", "deferredRevenue"], ["Short-term debt", "shortTermDebt"],
    ["Total current liabilities", "totalCurrentLiabilities", "strong"], ["Long-term debt", "longTermDebt"], ["Total liabilities", "totalLiabilities", "strong"],
    ["grp", "Equity"], ["Retained earnings", "retainedEarnings"], ["Total equity", "totalStockholdersEquity", "strong"],
    ["grp", "Position"], ["Total debt", "totalDebt"], ["Net debt (negative = net cash)", "netDebt", "strong"], ["Working capital", "_wc"],
    ["Current ratio", "_cr", "", "x"], ["Debt / equity", "_de", "", "x"]
  ];
  const fv = (v, kind) => kind === "x" ? (isNum(v) ? v.toFixed(2) + "×" : "—") : money(v, cur);
  let t = `<div class="tbl"><table><thead><tr><th>${esc(cur)}</th><th>${esc(L.label)}</th><th>${P ? esc(P.label) : ""}</th><th>${Y ? esc(Y.label) : "Year ago"}</th><th>QoQ change</th><th>YoY change</th></tr></thead><tbody>`;
  rows.forEach(r => {
    if (r[0] === "grp") { t += `<tr class="grp"><td colspan="6">${r[1]}</td></tr>`; return; }
    const [name, f, k, kind] = r; if (![L, P, Y].some(x => x && isNum(x[f]) && x[f] !== 0)) return;
    const dq = P && isNum(L[f]) && isNum(P[f]) ? L[f] - P[f] : null, dy = Y && isNum(L[f]) && isNum(Y[f]) ? L[f] - Y[f] : null;
    const show = (dv, base) => kind === "x" ? (isNum(dv) ? (dv > 0 ? "+" : dv < 0 ? "−" : "") + Math.abs(dv).toFixed(2) : "—") : (isNum(dv) ? `${money(dv, cur).replace(/^(?!−)/, dv > 0 ? "+" : "")} <span style="opacity:.7">${pct(growth(L[f], base))}</span>` : "—");
    t += `<tr class="${k || ""}"><td>${name}</td><td>${fv(L[f], kind)}</td><td>${P ? fv(P[f], kind) : ""}</td><td>${Y ? fv(Y[f], kind) : "—"}</td><td>${show(dq, P && P[f])}</td><td>${show(dy, Y && Y[f])}</td></tr>`;
  });
  t += `</tbody></table></div>`;
  return `<div class="grid2">${map}<div class="panel"><h4>Cash vs debt <small>by quarter</small></h4>${legend([{ name: "Cash & ST inv.", color: "var(--c1)" }, { name: "Total debt", color: "var(--c5)" }])}<div class="chart">${barChart(b.slice(-SHOW_Q).map(r => r.label), [{ name: "Cash & ST inv.", color: "var(--c1)", values: b.slice(-SHOW_Q).map(r => r.cashAndShortTermInvestments) }, { name: "Total debt", color: "var(--c5)", values: b.slice(-SHOW_Q).map(r => r.totalDebt) }], { fmt: v => money(v, cur) })}</div></div></div>${t}`;
}

function cfSection(d, cur) {
  const c = d.cf.slice(-SHOW_Q); if (!c.length) return `<p class="status">No cash flow data.</p>`;
  const incBy = {}; d.inc.forEach(r => incBy[r.date] = r);
  const rows = [
    ["Operating cash flow", r => r.operatingCashFlow ?? r.netCashProvidedByOperatingActivities, "strong"],
    ["Capital expenditure", r => r.capitalExpenditure, "sub"],
    ["Free cash flow", r => r.freeCashFlow, "strong"],
    ["FCF margin", r => incBy[r.date] ? ratio(r.freeCashFlow, incBy[r.date].revenue) : null, "", "pct"],
    ["Stock-based compensation", r => r.stockBasedCompensation, "sub"],
    ["Share buybacks", r => r.commonStockRepurchased, "sub"],
    ["Dividends paid", r => r.commonDividendsPaid ?? r.netDividendsPaid, "sub"],
    ["Acquisitions", r => r.acquisitionsNet, "sub"],
    ["Net debt issued / (repaid)", r => r.netDebtIssuance, "sub"]
  ];
  let t = `<div class="tbl"><table><thead><tr><th>${esc(cur)}</th>${c.map(r => `<th>${esc(r.label)}</th>`).join("")}</tr></thead><tbody>`;
  rows.forEach(([name, fn, k, kind]) => {
    const vals = c.map(fn); if (vals.every(v => !isNum(v) || v === 0)) return;
    t += `<tr class="${k}"><td>${name}</td>${vals.map(v => `<td class="${!isNum(v) ? "na" : ""}">${kind === "pct" ? pctPlain(v) : money(v, cur)}</td>`).join("")}</tr>`;
  });
  t += `</tbody></table></div>`;
  const s = [{ name: "Operating cash flow", color: "var(--c3)", values: c.map(r => r.operatingCashFlow ?? r.netCashProvidedByOperatingActivities) }, { name: "Free cash flow", color: "var(--c1)", values: c.map(r => r.freeCashFlow) }];
  const ret = [{ name: "Buybacks", color: "var(--c2)", values: c.map(r => Math.abs(n0(r.commonStockRepurchased))) }, { name: "Dividends", color: "var(--c4)", values: c.map(r => Math.abs(n0(r.commonDividendsPaid ?? r.netDividendsPaid))) }];
  return `<div class="grid2"><div class="panel"><h4>Operating vs free cash flow</h4>${legend(s)}<div class="chart">${barChart(c.map(r => r.label), s, { fmt: v => money(v, cur) })}</div></div>
    <div class="panel"><h4>Capital returned to shareholders</h4>${legend(ret)}<div class="chart">${barChart(c.map(r => r.label), ret, { stacked: true, fmt: v => money(v, cur) })}</div></div></div>${t}`;
}

/* ============ forecast ============ */
function nextQuarter(L) {
  if (L.period === "Q4") return { period: "Q1", fiscalYear: L.fiscalYear + 1 };
  const k = +String(L.period).replace(/\D/g, "") || 0;
  return { period: "Q" + (k + 1), fiscalYear: L.fiscalYear };
}
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = s => { if (!s) return "—"; const d = new Date(s + "T12:00:00Z"); return isNaN(d) ? s : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };

function buildForecast(d) {
  const q = d.inc, n = q.length; if (n < 2) return null;
  const L = q[n - 1], P = q[n - 2];
  const nx = nextQuarter(L), label = qLabel(nx);
  let yaI = q.findIndex(r => r.period === nx.period && r.fiscalYear === nx.fiscalYear - 1);
  if (yaI < 0 && n >= 4) yaI = n - 4;
  const ya = yaI >= 0 ? q[yaI] : null, yaPrev = yaI >= 1 ? q[yaI - 1] : null;
  const er = (Array.isArray(d.earnings) ? d.earnings : []).filter(e => e && e.date).sort((a, b) => a.date < b.date ? -1 : 1);
  const hasAct = e => isNum(e.revenueActual) || isNum(e.epsActual);
  const up = er.find(e => !hasAct(e) && e.date > L.date && (isNum(e.revenueEstimated) || isNum(e.epsEstimated))) || null;
  const rowFor = e => { const t = Date.parse(e.date); for (let i = q.length - 1; i >= 0; i--) { const t0 = Date.parse(q[i].date), t1 = i < q.length - 1 ? Date.parse(q[i + 1].date) : t0 + 110 * 864e5; if (t > t0 && t <= t1) return i; } return -1; };
  const past = er.filter(hasAct).slice(-8).map(e => ({ ...e, rowIdx: rowFor(e), revS: growth(e.revenueActual, e.revenueEstimated), epsS: growth(e.epsActual, e.epsEstimated) }));
  const rate = k => { const v = past.map(e => e[k]).filter(isNum); return v.length ? { beats: v.filter(x => x > 0).length, n: v.length, avg: mean(v) } : null; };

  const f = { label, nx, L, P, ya, up, past, revTrack: rate("revS"), epsTrack: rate("epsS") };
  // match each reported quarter with the estimate made for it (report date within ~4 months after quarter end)
  const used = new Set();
  f.hist = q.slice(-6).map(r => {
    const t0 = Date.parse(r.date), qi = q.indexOf(r);
    const t1 = qi < q.length - 1 ? Date.parse(q[qi + 1].date) : t0 + 110 * 864e5;   // must report before the next quarter ends
    let e = er.find(x => hasAct(x) && !used.has(x) && Date.parse(x.date) > t0 && Date.parse(x.date) <= t1);
    if (!e) e = er.find(x => !used.has(x) && isNum(x.revenueActual) && Math.abs(x.revenueActual - r.revenue) < Math.max(1e6, r.revenue * 1e-4));
    if (e) used.add(e);
    const epsA = e && isNum(e.epsActual) ? e.epsActual : r.epsDiluted;
    return { label: r.label, rev: r.revenue, eps: epsA, estRev: e ? e.revenueEstimated : null, estEps: e ? e.epsEstimated : null,
      revS: e ? growth(r.revenue, e.revenueEstimated) : null, epsS: e ? growth(epsA, e.epsEstimated) : null, reported: e ? e.date : null };
  });
  // every upcoming quarter with an estimate (usually one, sometimes two)
  let lab = { period: L.period, fiscalYear: L.fiscalYear };
  f.ups = er.filter(e => !hasAct(e) && e.date > L.date && (isNum(e.revenueEstimated) || isNum(e.epsEstimated))).slice(0, 3).map(e => {
    lab = nextQuarter(lab); return { ...e, label: qLabel(lab) };
  });
  const hb = f.hist.filter(h => isNum(h.revS)), he = f.hist.filter(h => isNum(h.epsS));
  f.chartTrack = { rev: hb.length ? { beats: hb.filter(h => h.revS > 0).length, n: hb.length } : null, eps: he.length ? { beats: he.filter(h => h.epsS > 0).length, n: he.length } : null };
  if (up) {
    f.date = up.date; f.cRev = up.revenueEstimated; f.cEps = up.epsEstimated;
    f.cRevQoQ = growth(f.cRev, L.revenue); f.cRevYoY = ya ? growth(f.cRev, ya.revenue) : null;
    f.cEpsQoQ = growth(f.cEps, L.epsDiluted); f.cEpsYoY = ya ? growth(f.cEps, ya.epsDiluted) : null;
  }
  const lastH = f.hist[f.hist.length - 1];
  if (lastH && isNum(f.cEps) && isNum(lastH.eps)) f.cEpsQoQ = growth(f.cEps, lastH.eps);
  const yaH = f.hist.find(h => h.label === (ya && ya.label));
  if (yaH && isNum(f.cEps) && isNum(yaH.eps)) f.cEpsYoY = growth(f.cEps, yaH.eps);
  // simple model: (1) year-ago quarter grown at recent YoY trend; (2) last quarter moved by last year's seasonal step
  const trendG = mean([L.revYoY, P.revYoY]);
  f.mTrend = ya && isNum(trendG) ? ya.revenue * (1 + trendG) : null;
  f.mSeason = ya && yaPrev && yaPrev.revenue ? L.revenue * ya.revenue / yaPrev.revenue : null;
  f.mRev = mean([f.mTrend, f.mSeason]);
  f.trendG = trendG;
  const yaOf = i => { const j = yearAgoIdx(q, i); return j >= 0 ? q[j] : null; };
  const epsG = mean([growth(L.epsDiluted, yaOf(n - 1) && yaOf(n - 1).epsDiluted), growth(P.epsDiluted, yaOf(n - 2) && yaOf(n - 2).epsDiluted)]);
  f.mEps = ya && isNum(ya.epsDiluted) && isNum(epsG) ? ya.epsDiluted * (1 + Math.max(-0.5, Math.min(1, epsG))) : null;
  const omChg = mean([yaOf(n - 1) ? L.om - yaOf(n - 1).om : null, yaOf(n - 2) ? P.om - yaOf(n - 2).om : null]);
  f.mOm = ya && isNum(ya.om) && isNum(omChg) ? ya.om + omChg : null;
  f.mRevQoQ = growth(f.mRev, L.revenue); f.mRevYoY = ya ? growth(f.mRev, ya.revenue) : null;
  f.modelVsCons = isNum(f.cRev) ? growth(f.mRev, f.cRev) : null;

  // annual consensus
  const est = (Array.isArray(d.est) ? d.est : []).filter(e => e && e.date).sort((a, b) => a.date < b.date ? -1 : 1);
  const fyActual = fy => { const rs = q.filter(r => r.fiscalYear === fy); return rs.length === 4 ? { rev: sum(rs.map(r => r.revenue)), eps: sum(rs.map(r => r.epsDiluted)) } : null; };
  const fut = est.filter(e => e.date > L.date).slice(0, 2);
  f.annual = fut.map(e => {
    const fy = +e.date.slice(0, 4), prevE = est.find(x => +x.date.slice(0, 4) === fy - 1), act = fyActual(fy - 1);
    const baseRev = act ? act.rev : prevE && prevE.revenueAvg, baseEps = act ? act.eps : prevE && prevE.epsAvg;
    return { fy, label: "FY" + String(fy).slice(-2) + "E", rev: e.revenueAvg, revLo: e.revenueLow, revHi: e.revenueHigh, eps: e.epsAvg, epsLo: e.epsLow, epsHi: e.epsHigh,
      revG: growth(e.revenueAvg, baseRev), epsG: growth(e.epsAvg, baseEps), nRev: e.numAnalystsRevenue, nEps: e.numAnalystsEps,
      fpe: isNum(d.profile.price) && e.epsAvg > 0 && (d.profile.currency || "USD") === d.currency ? d.profile.price / e.epsAvg : null };
  });
  if (d.pt && isNum(d.pt.targetConsensus)) f.pt = { ...d.pt, upside: growth(d.pt.targetConsensus, d.profile.price) };

  // segment projection (only with quarterly segment data)
  const s = d.seg;
  if (s && s.mode === "quarter") {
    const rows = s.rows, li = rows.length - 1;
    const sya = rows.findIndex(r => r.period === nx.period && r.fiscalYear === nx.fiscalYear - 1);
    if (sya >= 0) {
      const yoyAt = (i, nm) => { const j = yearAgoIdx(rows, i); return j >= 0 && j !== i ? growth(rows[i].data[nm], rows[j].data[nm]) : null; };
      f.seg = s.names.map(nm => {
        const g = mean([yoyAt(li, nm), yoyAt(li - 1, nm)]);
        const base = rows[sya].data[nm], est2 = isNum(base) && isNum(g) ? base * (1 + g) : null;
        return { name: nm, last: rows[li].data[nm], est: est2, g, qoq: growth(est2, rows[li].data[nm]) };
      }).filter(x => isNum(x.est) || isNum(x.last));
      f.segLabels = { last: rows[li].label, ya: rows[sya].label };
    }
  }
  return f;
}

function forecastInsight(f, cur, add) {
  if (!f) return;
  if (isNum(f.cRev)) {
    const accel = isNum(f.cRevYoY) && isNum(f.L.revYoY) ? (Math.abs(f.cRevYoY - f.L.revYoY) < 0.01 ? "similar to" : f.cRevYoY > f.L.revYoY ? "an acceleration from" : "a slowdown from") : "";
    let body = `Analysts expect <b>${money(f.cRev, cur)}</b> revenue for ${f.label} on ${fmtDate(f.date)}: ${pct(f.cRevQoQ)} QoQ and ${pct(f.cRevYoY)} YoY${accel ? `, ${accel} ${pct(f.L.revYoY)} last quarter` : ""}.`;
    if (isNum(f.cEps)) body += ` EPS estimate ${f.cEps.toFixed(2)} (${pct(f.cEpsYoY)} YoY).`;
    if (isNum(f.mRev)) body += ` The simple model in this tool lands at ${money(f.mRev, cur)}, ${pct(f.modelVsCons)} vs consensus.`;
    if (f.revTrack) body += ` Revenue has beaten estimates in ${f.revTrack.beats} of the last ${f.revTrack.n} quarters (average surprise ${pct(f.revTrack.avg)}).`;
    const tone = isNum(f.cRevYoY) && f.cRevYoY > 0 ? (f.revTrack && f.revTrack.beats / f.revTrack.n >= 0.6 ? "pos" : "neu") : "neg";
    add(tone, `Next quarter · ${f.label}`, `Consensus expects revenue ${pct(MODE() === "qoq" ? f.cRevQoQ : f.cRevYoY)} ${MODE() === "qoq" ? "QoQ" : "YoY"}`, body);
  } else if (isNum(f.mRev)) {
    add("neu", `Next quarter · ${f.label}`, "No consensus estimate available", `There is no analyst estimate for ${f.label} in the data. The simple model in this tool projects ${money(f.mRev, cur)} (${pct(f.mRevQoQ)} QoQ, ${pct(f.mRevYoY)} YoY).`);
  }
}

function forecastSection(d) {
  const f = d.fc, cur = d.currency;
  if (!f) return "";
  const mode = MODE();
  const card = (eyebrow, big, rows, foot) => `<div class="fc"><span class="eyebrow">${eyebrow}</span><span class="v">${big}</span>${rows ? `<span class="d">${rows}</span>` : ""}${foot ? `<span class="foot">${foot}</span>` : ""}</div>`;
  const chips = (qq, yy) => `<span>QoQ ${chip(qq)}</span><span>YoY ${chip(yy)}</span>`;
  const cards = [
    card(`Consensus revenue · ${esc(f.label)}`, money(f.cRev, cur), isNum(f.cRev) ? chips(f.cRevQoQ, f.cRevYoY) : "", isNum(f.cRev) ? (isNum(f.L.revYoY) && isNum(f.cRevYoY) ? `Last quarter grew ${pct(f.L.revYoY)} YoY` : "") : "No estimate in the data"),
    card("Consensus EPS", isNum(f.cEps) ? f.cEps.toFixed(2) : "—", isNum(f.cEps) ? chips(f.cEpsQoQ, f.cEpsYoY) : "", isNum(f.cEps) ? "Compared with EPS as reported against estimates" : ""),
    card("Model revenue", money(f.mRev, cur), isNum(f.mRev) ? chips(f.mRevQoQ, f.mRevYoY) : "", isNum(f.modelVsCons) ? `${pct(f.modelVsCons)} vs consensus` : "Needs a year of history"),
    card("Track record", f.revTrack ? `${f.revTrack.beats}/${f.revTrack.n}` : "—", f.revTrack ? `<span>Revenue beats · avg ${chip(f.revTrack.avg)}</span>` : "", f.epsTrack ? `EPS beat ${f.epsTrack.beats} of ${f.epsTrack.n}, avg surprise ${pct(f.epsTrack.avg)}` : "")
  ].join("");

  // charts: reported quarters with the consensus made for each (beat / miss), then upcoming quarters' consensus
  const ups = f.ups.length ? f.ups : (isNum(f.mRev) ? [{ label: f.label, revenueEstimated: null, epsEstimated: null, modelOnly: true }] : []);
  const labels = [...f.hist.map(h => h.label), ...ups.map(u => u.label + "E")];
  const estFrom = f.hist.length;
  const clickKeys = [...f.hist.map(h => h.reported), ...ups.map(u => u.date || null)];
  const fills = labels.map((_, i) => i >= estFrom ? "var(--accent-soft)" : "var(--accent)");
  const surpriseTxt = (s2, est, fmtE) => isNum(s2) ? [{ t: `${s2 >= 0 ? "Beat" : "Miss"} ${pct(s2, 1)}`, tone: s2 >= 0 ? "pos" : "neg", bold: true }, { t: `est ${fmtE(est)}` }] : null;
  const prevRev = f.L.revenue, prevEps = f.hist.length ? f.hist[f.hist.length - 1].eps : null;
  const expTxt = (v, base, yaBase, fmtV) => { if (!isNum(v)) return null; const g2 = mode === "qoq" ? growth(v, base) : growth(v, yaBase); return [{ t: "Exp " + fmtV(v), bold: true }, { t: `${pct(g2, 1)} ${mode === "qoq" ? "QoQ" : "YoY"}`, tone: isNum(g2) ? (g2 >= 0 ? "pos" : "neg") : "" }]; };
  const yaFor = (u, k) => { const m0 = /Q(\d) FY(\d\d)/.exec(u.label); if (m0 && k === "epsDiluted") { const h = f.hist.find(x => x.label === `Q${m0[1]} FY${String(+m0[2] - 1).padStart(2, "0")}`); if (h && isNum(h.eps)) return h.eps; } const q2 = d.inc; const m = /Q(\d) FY(\d\d)/.exec(u.label); if (!m) return null; const r = q2.find(x => x.period === "Q" + m[1] && String(x.fiscalYear).slice(-2) === String(+m[2] - 1).padStart(2, "0")); return r ? r[k] : null; };

  // revenue
  let base = prevRev;
  const revVals = [...f.hist.map(h => h.rev), ...ups.map(u => isNum(u.revenueEstimated) ? u.revenueEstimated : (u.modelOnly ? f.mRev : null))];
  const revMarks = [...f.hist.map(h => h.estRev), ...ups.map(() => null)];
  const revModel = labels.map((_, i) => i === estFrom && isNum(f.mRev) && !ups[0].modelOnly ? f.mRev : null);
  const revTxt = [...f.hist.map(h => surpriseTxt(h.revS, h.estRev, v => money(v, cur))), ...ups.map(u => { const v = isNum(u.revenueEstimated) ? u.revenueEstimated : (u.modelOnly ? f.mRev : null); const t = expTxt(v, base, yaFor(u, "revenue"), x => money(x, cur)); base = v; return t; })];
  // eps
  let baseE = prevEps;
  const epsVals = [...f.hist.map(h => h.eps), ...ups.map(u => u.epsEstimated)];
  const epsMarks = [...f.hist.map(h => h.estEps), ...ups.map(() => null)];
  const epsModel = labels.map((_, i) => i === estFrom && isNum(f.mEps) && !ups[0].modelOnly ? f.mEps : null);
  const epsTxt = [...f.hist.map(h => surpriseTxt(h.epsS, h.estEps, v => v.toFixed(2))), ...ups.map(u => { const t = expTxt(u.epsEstimated, baseE, yaFor(u, "epsDiluted"), x => x.toFixed(2)); baseE = u.epsEstimated; return t; })];

  const lg = (hasModel) => legend([{ name: "Reported", color: "var(--accent)" }, { name: "Consensus for upcoming quarter", color: "var(--accent-soft)" }, { name: "Consensus at the time (dashed line)", color: "var(--ink)" }].concat(hasModel ? [{ name: "Model (dotted)", color: "var(--c2)" }] : []));
  const trackTxt = t => t ? `beat ${t.beats} of ${t.n}` : "";
  const chart = `<div class="panel"><h4>Revenue: actual vs expectations <small>${esc(trackTxt(f.chartTrack.rev))} · click a quarter for its price chart</small></h4>${lg(revModel.some(isNum))}
      <div class="chart">${barChart(labels, [{ name: "Revenue", color: "var(--accent)", values: revVals }], { clickKeys, annotText: revTxt, fills, marks: revMarks, markName: "Consensus", marks2: revModel, mark2Name: "Model", estFrom, topPad: 14, fmt: v => money(v, cur), title: "Revenue actual vs expectations" })}</div></div>`;
  const epsChart = `<div class="panel"><h4>EPS: actual vs expectations <small>${esc(trackTxt(f.chartTrack.eps))}</small></h4>${lg(epsModel.some(isNum))}
      <div class="chart">${barChart(labels, [{ name: "EPS", color: "var(--accent)", values: epsVals }], { clickKeys, annotText: epsTxt, fills, marks: epsMarks, markName: "Consensus", marks2: epsModel, mark2Name: "Model", estFrom, topPad: 14, fmt: v => v.toFixed(2), title: "EPS actual vs expectations" })}</div></div>`;

  // annual + target
  const an = f.annual && f.annual.length ? `<div class="tbl"><table><thead><tr><th>Consensus</th>${f.annual.map(a => `<th>${esc(a.label)}</th>`).join("")}</tr></thead><tbody>
      <tr class="strong"><td>Revenue</td>${f.annual.map(a => `<td>${money(a.rev, cur)}</td>`).join("")}</tr>
      <tr class="sub"><td>Growth</td>${f.annual.map(a => `<td class="${cls(a.revG)}">${pct(a.revG)}</td>`).join("")}</tr>
      <tr class="sub"><td>Range</td>${f.annual.map(a => `<td>${money(a.revLo, cur)} – ${money(a.revHi, cur)}</td>`).join("")}</tr>
      <tr class="strong"><td>EPS</td>${f.annual.map(a => `<td>${isNum(a.eps) ? a.eps.toFixed(2) : "—"}</td>`).join("")}</tr>
      <tr class="sub"><td>Growth</td>${f.annual.map(a => `<td class="${cls(a.epsG)}">${pct(a.epsG)}</td>`).join("")}</tr>
      <tr><td>Forward P/E</td>${f.annual.map(a => `<td>${isNum(a.fpe) ? a.fpe.toFixed(1) + "×" : "—"}</td>`).join("")}</tr>
      <tr class="sub"><td>Analysts (rev / EPS)</td>${f.annual.map(a => `<td>${a.nRev ?? "—"} / ${a.nEps ?? "—"}</td>`).join("")}</tr>
    </tbody></table></div>` : `<p class="note">No annual analyst estimates in the data.</p>`;
  const pt = f.pt ? `<div class="pt"><div class="pthead"><span class="eyebrow">Analyst price target</span><span class="v">${f.pt.targetConsensus.toFixed(2)}</span><span class="d">${chip(f.pt.upside)} vs current price ${isNum(d.profile.price) ? d.profile.price.toFixed(2) : "—"}</span></div>
      ${isNum(f.pt.targetLow) && isNum(f.pt.targetHigh) && isNum(d.profile.price) ? ptRange(f.pt.targetLow, f.pt.targetHigh, f.pt.targetConsensus, d.profile.price) : ""}</div>` : "";
  const annual = `<div class="panel"><h4>Full-year consensus</h4>${an}${pt}</div>`;

  // beat history
  const gW = mode === "qoq" ? "QoQ" : "YoY";
  const yaRev = lab => { const m = /Q(\d) FY(\d\d)/.exec(lab); if (!m) return null; const r = d.inc.find(x => x.period === "Q" + m[1] && String(x.fiscalYear).slice(-2) === String(+m[2] - 1).padStart(2, "0")); return r ? r.revenue : null; };
  let upBase = f.L.revenue;
  const upCalc = f.ups.map(u => { const base = mode === "qoq" ? upBase : yaRev(u.label); const g = growth(u.revenueEstimated, base); if (isNum(u.revenueEstimated)) upBase = u.revenueEstimated; return { ...u, estG: g }; });
  const gcell = v => `<td class="${cls(v)}">${pct(v)}</td>`;
  const upRows = upCalc.map(u => `<tr class="me clk" data-evt="${esc(u.date)}" tabindex="0" title="Show the price chart around this report"><td>${esc(u.label)} · ${esc(fmtDate(u.date))}</td><td>${money(u.revenueEstimated, cur)}</td>${gcell(u.estG)}<td>upcoming</td><td></td><td></td>
      <td>${isNum(u.epsEstimated) ? u.epsEstimated.toFixed(2) : "—"}</td><td>upcoming</td><td></td></tr>`).reverse().join("");
  const pastRows = [...f.past].reverse().map(e => {
    const i = e.rowIdx, bi = i >= 0 ? (mode === "qoq" ? i - 1 : yearAgoIdx(d.inc, i)) : -1;
    const base = bi >= 0 && bi !== i ? d.inc[bi].revenue : null;
    const lab = i >= 0 ? d.inc[i].label + " · " : "";
    return `<tr class="clk" data-evt="${esc(e.date)}" tabindex="0" title="Show the price chart ±30 days around this report"><td>${esc(lab + fmtDate(e.date))} <span class="go">↗</span></td><td>${money(e.revenueEstimated, cur)}</td>${gcell(growth(e.revenueEstimated, base))}<td>${money(e.revenueActual, cur)}</td>${gcell(growth(e.revenueActual, base))}<td class="${cls(e.revS)}"><b>${pct(e.revS)}</b></td>
      <td>${isNum(e.epsEstimated) ? e.epsEstimated.toFixed(2) : "—"}</td><td>${isNum(e.epsActual) ? e.epsActual.toFixed(2) : "—"}</td><td class="${cls(e.epsS)}">${pct(e.epsS)}</td></tr>`;
  }).join("");
  const ph = f.past.length || f.ups.length ? `<div class="tbl"><table><thead>
    <tr class="gh"><th></th><th colspan="5">Revenue</th><th colspan="3">EPS</th></tr>
    <tr><th>Quarter · report date</th><th>Estimate</th><th>Est. growth ${gW}</th><th>Actual</th><th>Actual growth ${gW}</th><th>Surprise</th><th>Estimate</th><th>Actual</th><th>Surprise</th></tr></thead><tbody>
    ${upRows}${pastRows}
  </tbody></table></div>` : "";

  // segment projection
  const sp = f.seg && f.seg.length ? `<div class="panel"><h4>Segment projection for ${esc(f.label)} <small>model: ${esc(f.segLabels.ya)} grown at each segment's recent YoY trend</small></h4><div class="tbl"><table><thead><tr><th>Segment</th><th>${esc(f.segLabels.last)} actual</th><th>${esc(f.label)} model</th><th>QoQ</th><th>Trend YoY</th></tr></thead><tbody>
    ${f.seg.map(x => `<tr><td>${esc(x.name)}</td><td>${money(x.last, cur)}</td><td>${money(x.est, cur)}</td><td class="big ${cls(x.qoq)}">${pct(x.qoq)}</td><td class="${cls(x.g)}">${pct(x.g)}</td></tr>`).join("")}
  </tbody></table></div></div>` : (d.seg ? `<p class="note">A segment-level projection needs quarterly segment data, which your Financial Modeling Prep plan doesn't return.</p>` : "");

  const method = `<p class="note">It averages two simple projections. The first takes the same quarter last year (${f.ya ? esc(f.ya.label) : "—"}) and grows it at the average YoY rate of the last two quarters (${pct(f.trendG)}): ${money(f.mTrend, cur)}. The second takes last quarter and applies the seasonal step seen between the same two quarters a year ago: ${money(f.mSeason, cur)}.${isNum(f.mOm) ? ` On the same basis operating margin would be about ${pctPlain(f.mOm)}.` : ""} It's a statistical baseline to sanity-check consensus, not a prediction.</p>`;

  return `<section class="sec" id="forecast">
    <div class="sec-h"><div><span class="eyebrow">Next reporting quarter</span><h2>Forecast: ${esc(f.label)}</h2>
      <p>${f.date ? `Expected report date ${esc(fmtDate(f.date))}. ` : ""}Wall Street consensus from Financial Modeling Prep, beside a simple model built from this company's own seasonality and recent growth.</p></div></div>
    <div class="fcards">${cards}</div>
    <div class="grid2">${chart}${epsChart}</div>
    ${ph ? `<div class="panel"><h4><span>Estimates vs actuals</span><button type="button" class="btn ghost sm" data-pxmode="general">Price chart</button></h4>
      <p class="note">Click a row to see how the stock traded ±30 days around that report. Growth is ${mode === "qoq" ? "vs the previous quarter" : "vs the same quarter last year"}; change it with the Compare switch.</p>${ph}</div>` : ""}
    <div class="panel pxpanel" id="pxPanel" hidden></div>
    <div class="grid2">${annual}<div class="panel"><h4>How the model works</h4>${method}</div></div>
    ${sp}
  </section>`;
}

function ptRange(lo, hi, cons, price) {
  const a = Math.min(lo, price), b = Math.max(hi, price), span = (b - a) || 1;
  const X = v => ((v - a) / span * 100).toFixed(2);
  return `<div class="ptbar" aria-label="Price target range"><span class="rng" style="left:${X(lo)}%;width:${(X(hi) - X(lo)).toFixed(2)}%"></span>
    <span class="tk cons" style="left:${X(cons)}%" title="Consensus ${cons.toFixed(2)}"></span><span class="tk px" style="left:${X(price)}%" title="Price ${price.toFixed(2)}"></span></div>
    <div class="ptlab"><span>Low ${lo.toFixed(0)}</span><span><i class="dot px"></i>Price <i class="dot cons"></i>Consensus</span><span>High ${hi.toFixed(0)}</span></div>`;
}

/* ============ price chart (OHLC candlesticks) ============ */
const addDays = (iso, n) => { const t = new Date(iso + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const shortDate = s => { const d = new Date(s + "T12:00:00Z"); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); };
const monYr = s => { const d = new Date(s + "T12:00:00Z"); return d.toLocaleDateString("en-GB", { month: "short", year: "2-digit" }); };
const fmtVol = v => !isNum(v) ? "—" : v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : String(v);

async function prices(sym, from, to) {
  const r = await api("historical-price-eod/full", { symbol: sym, from, to });
  return (Array.isArray(r) ? r : []).filter(x => x && x.date && isNum(x.open) && isNum(x.high) && isNum(x.low) && isNum(x.close))
    .map(x => ({ date: x.date, open: x.open, high: x.high, low: x.low, close: x.close, volume: x.volume }))

// weekly OHLC from daily OHLC: first open, highest high, lowest low, last close, summed volume
function toWeekly(rows) {
  const out = []; let cur = null, key = null;
  rows.forEach(r => {
    const d = new Date(r.date + "T12:00:00Z"), k = addDays(r.date, -((d.getUTCDay() + 6) % 7));
    if (k !== key) { if (cur) out.push(cur); key = k; cur = { date: r.date, open: r.open, high: r.high, low: r.low, close: r.close, volume: n0(r.volume), end: r.date }; }
    else { cur.high = Math.max(cur.high, r.high); cur.low = Math.min(cur.low, r.low); cur.close = r.close; cur.volume += n0(r.volume); cur.end = r.date; }
  });

}

function reportList(d) {
  const f = d.fc; if (!f) return [];
  const past = f.past.map(e => ({ date: e.date, label: e.rowIdx >= 0 ? d.inc[e.rowIdx].label : fmtDate(e.date), revS: e.revS, epsS: e.epsS, upcoming: false }));
  const ups = f.ups.map(u => ({ date: u.date, label: u.label, upcoming: true }));
  return [...past, ...ups].sort((a, b) => a.date < b.date ? -1 : 1);
}
const repTone = r => r.upcoming ? "neu" : isNum(r.revS) ? (r.revS >= 0 ? "pos" : "neg") : "neu";
const repSub = r => r.upcoming ? "upcoming" : isNum(r.revS) ? `${r.revS >= 0 ? "Beat" : "Miss"} ${pct(r.revS)}` : "";

// index of the candle that contains (or first follows) a date; beyond the data -> past the end
function idxForDate(rows, date) {
  for (let i = 0; i < rows.length; i++) { const end = rows[i].end || rows[i].date; if (end >= date) return i; }
  return rows.length + 1;
}

function candleChart(rows, o = {}) {
  const Wd = Math.max(320, Math.round(o.width || 720)), Ht = Math.round(Math.min(460, Math.max(300, Wd * 0.48))), m = { t: 34, r: 58, b: 26, l: 8 }, volH = Wd < 500 ? 44 : 62, gap = 12;
  const markers = (o.markers || []).map(mk => ({ ...mk, i: idxForDate(rows, mk.date) }));
  const slots = Math.max(rows.length, ...markers.map(mk => mk.i + 2));
  const pw = Wd - m.l - m.r, ph = Ht - m.t - m.b - volH - gap, bw = pw / Math.max(1, slots);
  const lo = Math.min(...rows.map(r => r.low)), hi = Math.max(...rows.map(r => r.high)), pad = (hi - lo) * 0.05 || hi * 0.01;
  const yt = niceTicks(lo - pad, hi + pad, 5), y0 = yt[0], y1 = yt[yt.length - 1];
  const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ph;
  const vmax = Math.max(...rows.map(r => n0(r.volume))) || 1, vTop = m.t + ph + gap, VY = v => vTop + volH - (n0(v) / vmax) * volH;
  const X = i => m.l + i * bw + bw / 2;
  let g = "";
  if (o.band) { const [a, b] = o.band; if (a <= b && a < rows.length) g += `<rect x="${X(a) - bw / 2}" y="${m.t}" width="${(Math.min(b, rows.length - 1) - a + 1) * bw}" height="${ph + gap + volH}" fill="var(--accent-soft)" opacity=".8"/>`; }
  yt.forEach(t => g += `<line class="gl" x1="${m.l}" x2="${Wd - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${Wd - m.r + 6}" y="${Y(t) + 3.5}">${t.toFixed(t >= 1000 ? 0 : 2)}</text>`);
  g += `<line class="gl" x1="${m.l}" x2="${Wd - m.r}" y1="${vTop + volH}" y2="${vTop + volH}"/><text x="${Wd - m.r + 6}" y="${vTop + 10}">${fmtVol(vmax)}</text>`;
  // x labels: about 6, never crowded
  const step = Math.max(1, Math.ceil(rows.length / Math.max(3, Math.floor(Wd / 120))));
  for (let i = Math.floor(step / 2); i < rows.length; i += step) g += `<text x="${X(i)}" y="${Ht - 8}" text-anchor="middle">${esc(o.weekly || rows.length > 140 ? monYr(rows[i].date) : shortDate(rows[i].date))}</text>`;
  const cw = Math.max(1, Math.min(12, bw * 0.66));
  rows.forEach((r, i) => {
    const up = r.close >= r.open, col = up ? "var(--pos)" : "var(--neg)", x = X(i), yo = Y(r.open), yc = Y(r.close);
    g += `<line x1="${x}" x2="${x}" y1="${Y(r.high)}" y2="${Y(r.low)}" stroke="${col}" stroke-width="1"/>`;
    g += `<rect x="${x - cw / 2}" y="${Math.min(yo, yc)}" width="${cw}" height="${Math.max(1, Math.abs(yo - yc))}" fill="${col}"/>`;
    g += `<rect x="${x - cw / 2}" y="${VY(r.volume)}" width="${cw}" height="${Math.max(0.5, vTop + volH - VY(r.volume))}" fill="${col}" opacity=".35"/>`;
  });
  const mxs = markers.map(mk => mk.i < rows.length ? X(mk.i) - bw / 2 : X(Math.min(mk.i, slots - 1)));
  const minGap = mxs.length > 1 ? Math.min(...mxs.slice(1).map((x, k) => x - mxs[k])) : Infinity;
  markers.forEach((mk, k) => {
    const x = mxs[k];
    if (minGap < 74 && !mk.active) mk.sub = "";
    if (minGap < 46 && !mk.active) mk.label = k % 2 ? "" : mk.label;
    const tone = mk.tone === "pos" ? "--pos" : mk.tone === "neg" ? "--neg" : "--muted";
    const inner = `<line x1="${x}" x2="${x}" y1="${m.t - 4}" y2="${vTop + volH}" stroke="var(${mk.active ? "--accent" : "--ink"})" stroke-width="${mk.active ? 2 : 1.2}" stroke-dasharray="4 3"/>
      <text x="${Math.min(Wd - m.r - 4, Math.max(m.l + 24, x))}" y="${m.t - 18}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${esc(mk.label)}</text>
      <text x="${Math.min(Wd - m.r - 4, Math.max(m.l + 24, x))}" y="${m.t - 7}" text-anchor="middle" style="fill:var(${tone});font-weight:500">${esc(mk.sub || "")}</text>`;
    g += mk.key ? `<g class="mk" data-evt="${esc(mk.key)}" role="button" tabindex="0" aria-label="Show trading around ${esc(mk.label)} report"><rect x="${x - 26}" y="${m.t - 30}" width="52" height="${ph + gap + volH + 30}" fill="transparent"/>${inner}<title>Zoom to ±30 days around this report</title></g>` : inner;
  });
  g += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${vTop + volH}" stroke="var(--muted)" stroke-width="1" opacity="0"/>`;
  g += `<rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph + gap + volH}" fill="transparent" style="pointer-events:${markers.some(mk => mk.key) ? "none" : "all"}"/>`;
  return { svg: `<svg viewBox="0 0 ${Wd} ${Ht}" class="candles" role="img" aria-label="${esc(o.title || "Price chart")}">${g}</svg>`, geom: { m, bw, slots, Wd, X } };
}

function attachCandleHover(wrap, rows, geom, readout, defIdx) {
  const svg = wrap.querySelector("svg.candles"); if (!svg || !rows.length) return;
  const cross = svg.querySelector(".cross");
  const show = i => {
    const r = rows[i]; if (!r) return;
    const prev = rows[i - 1], chg = prev ? growth(r.close, prev.close) : null;
    const dt = new Date(r.date + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    readout.innerHTML = `<b>${esc(r.end && r.end !== r.date ? `Week of ${shortDate(r.date)}` : dt)}</b><span>O ${r.open.toFixed(2)}</span><span>H ${r.high.toFixed(2)}</span><span>L ${r.low.toFixed(2)}</span><span>C ${r.close.toFixed(2)}</span><span class="${cls(chg)}">${pct(chg, 2)}</span><span>Vol ${fmtVol(r.volume)}</span>`;
    const x = geom.X(i); cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("opacity", ".6");
  };
  const at = ev => {
    const b = svg.getBoundingClientRect(); if (!b.width) return;
    const vx = (ev.clientX - b.left) / b.width * geom.Wd;
    const i = Math.floor((vx - geom.m.l) / geom.bw);
    if (i >= 0 && i < rows.length) show(i);
  };
  svg.addEventListener("pointermove", at);
  svg.addEventListener("pointerdown", at);
  svg.addEventListener("pointerleave", () => { show(defIdx); });
  show(defIdx);
}

function median(arr) { const v = arr.filter(isNum).sort((a, b) => a - b); if (!v.length) return null; const h = v.length >> 1; return v.length % 2 ? v[h] : (v[h - 1] + v[h]) / 2; }

    const d = om(me) - omMed;
    out.push({ tone: d >= 0 ? "pos" : "neg", tag: "Margins", title: `Operating margin ${d >= 0 ? "above" : "below"} peers`,
      body: `TTM operating margin ${pctPlain(om(me))} vs peer median ${pctPlain(omMed)} (${pp(d)}), ranking <b>${rank(om)}</b>. Latest quarter ${pctPlain(omq(me))} vs median ${pctPlain(med(omq))}.` });
  }
  const vals = [["EV/Sales", x => x.evS], ["EV/EBITDA", x => x.evE], ["Fwd P/E", x => x.fpe], ["P/E", x => x.pe]]
    .map(([lab, get]) => { const v = get(me), mm = medV(get); return multOk(v) && isNum(mm) ? { lab, v, mm, prem: v / mm - 1 } : null; }).filter(Boolean);
  if (vals.length) {
    const avgPrem = mean(vals.map(v => v.prem));
    const faster = isNum(gy(me)) && isNum(gyMed) ? gy(me) > gyMed : null, richer = isNum(om(me)) && isNum(omMed) ? om(me) > omMed : null;
    let title, tone;
    if (avgPrem > 0.15) { title = faster && richer ? "Premium backed by faster growth and higher margins" : faster || richer ? "Premium partly backed by fundamentals" : "Premium not backed by growth or margins"; tone = faster && richer ? "pos" : faster || richer ? "neu" : "neg"; }
    else if (avgPrem < -0.15) { title = faster ? "Discount despite faster growth" : "Discount in line with slower growth"; tone = faster ? "pos" : "neu"; }
    else { title = "Valued in line with peers"; tone = "neu"; }
    out.push({ tone, tag: "Valuation", title, body: `Versus the peer median: ${vals.map(v => `${v.lab} ${mult(v.v)} vs ${mult(v.mm)} (<b>${pct(v.prem, 0)}</b>)`).join(", ")}. YoY growth ${pct(gy(me))} vs median ${pct(gyMed)}.` });
  }
  return out;
}

function scatterChart(pts, xLab, yLab, xf, yf) {
  const P = pts.filter(p => isNum(p.x) && isNum(p.y));
  if (P.length < 2) return `<p class="note">Not enough companies with both figures to plot.</p>`;
  const Wd = 640, Ht = 320, m = { t: 16, r: 24, b: 44, l: 56 };
  const xs = P.map(p => p.x), ys = P.map(p => p.y);
  const xp = (Math.max(...xs) - Math.min(...xs)) * 0.12 || 0.02, yp = (Math.max(...ys) - Math.min(...ys)) * 0.12 || 1;
  const xt = niceTicks(Math.min(...xs) - xp, Math.max(...xs) + xp), yt = niceTicks(Math.max(0, Math.min(...ys) - yp), Math.max(...ys) + yp);
  const X = v => m.l + (v - xt[0]) / (xt[xt.length - 1] - xt[0]) * (Wd - m.l - m.r), Y = v => m.t + (1 - (v - yt[0]) / (yt[yt.length - 1] - yt[0])) * (Ht - m.t - m.b);
  let g = yt.map(t => `<line class="gl" x1="${m.l}" x2="${Wd - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l - 8}" y="${Y(t) + 3.5}" text-anchor="end">${yf(t)}</text>`).join("");
  g += xt.map(t => `<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${Ht - m.b}"/><text x="${X(t)}" y="${Ht - m.b + 16}" text-anchor="middle">${xf(t)}</text>`).join("");
  if (xt[0] < 0 && xt[xt.length - 1] > 0) g += `<line class="zero" x1="${X(0)}" x2="${X(0)}" y1="${m.t}" y2="${Ht - m.b}"/>`;
  const mx = median(P.filter(p => !p.me).map(p => p.x)), my = median(P.filter(p => !p.me).map(p => p.y));
  if (isNum(mx) && isNum(my)) g += `<line x1="${X(mx)}" x2="${X(mx)}" y1="${m.t}" y2="${Ht - m.b}" stroke="var(--muted)" stroke-dasharray="3 4"/><line x1="${m.l}" x2="${Wd - m.r}" y1="${Y(my)}" y2="${Y(my)}" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="${Wd - m.r}" y="${Y(my) - 5}" text-anchor="end">peer median</text>`;
  g += `<text x="${(m.l + Wd - m.r) / 2}" y="${Ht - 6}" text-anchor="middle" style="fill:var(--ink)">${esc(xLab)} →</text><text transform="translate(14 ${(m.t + Ht - m.b) / 2}) rotate(-90)" text-anchor="middle" style="fill:var(--ink)">${esc(yLab)} →</text>`;
  [...P].sort((a, b) => (a.me ? 1 : 0) - (b.me ? 1 : 0)).forEach(p => {
    const right = X(p.x) > Wd - 110;
    g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.me ? 7 : 5}" fill="${p.me ? "var(--accent)" : "var(--c8)"}" stroke="var(--surface)" stroke-width="2"><title>${esc(p.label)}: ${xf(p.x)}, ${yf(p.y)}</title></circle>
      <text x="${X(p.x) + (right ? -10 : 10)}" y="${Y(p.y) + 4}" text-anchor="${right ? "end" : "start"}" style="fill:${p.me ? "var(--accent)" : "var(--ink)"};font-weight:${p.me ? 600 : 500}">${esc(p.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${esc(yLab)} against ${esc(xLab)}">${g}</svg>`;
}

function rankBars(items, fmt) {
  const v = items.filter(i => isNum(i.v)).sort((a, b) => b.v - a.v);
  if (!v.length) return `<p class="note">No data.</p>`;
  const mx = Math.max(...v.map(i => Math.abs(i.v))) || 1, neg = v.some(i => i.v < 0);
  return `<div class="bridge">${v.map(i => {
    const w = (neg ? 50 : 100) * Math.abs(i.v) / mx, left = neg ? (i.v >= 0 ? 50 : 50 - w) : 0;
    return `<div class="br ${i.me ? "me" : ""}"><span class="nm">${esc(i.label)}</span><span class="track"><i style="left:${left}%;width:${Math.max(0.6, w)}%;background:${i.me ? "var(--accent)" : i.v < 0 ? "var(--neg)" : "var(--c8)"}"></i></span><span class="vals">${fmt(i.v)}</span></div>`;
  }).join("")}</div>`;
}

async function renderPeers() {
  const d = STATE.d, pane = document.getElementById("pane-peers");
  if (!d || !pane) return;
  const main = d.symbol, token = ++STATE.peerSeq;
  if (STATE.peerFor !== main) {
    STATE.peerFor = main; STATE.peers = null; STATE.suggested = null;
    try { const s = JSON.parse(store.get("peers:" + main) || "null"); if (Array.isArray(s)) STATE.peers = s; } catch (e) {}
  }
  if (!STATE.peers || !STATE.suggested) {
    if (!STATE.peers) pane.innerHTML = `<div class="status">Finding peers for ${esc(main)}…</div>`;
    const sug = await suggestedPeers(main);
    if (token !== STATE.peerSeq) return;
    STATE.suggested = sug;
    if (!STATE.peers) STATE.peers = [...sug];
  }
  const syms = [main, ...STATE.peers.filter(s => s !== main)];
  pane.innerHTML = peerControls(syms, {}) + `<div class="status">Loading ${syms.length} companies…</div><div class="skel"></div>`;
  wirePeerControls();
  const res = await Promise.allSettled(syms.map(peerMetrics));
  if (token !== STATE.peerSeq) return;
  const errs = {}, ok = [];
  res.forEach((r, i) => { if (r.status === "fulfilled") ok.push(r.value); else errs[syms[i]] = r.reason && r.reason.message || "Failed"; });
  const me = ok.find(x => x.sym === main), peers = ok.filter(x => x.sym !== main);
  let html = peerControls(syms, errs);
  if (!me) { pane.innerHTML = html + `<div class="status err">Couldn't load ${esc(main)} for comparison.</div>`; wirePeerControls(); return; }
  if (!peers.length) { pane.innerHTML = html + `<div class="status">Add a ticker above to compare ${esc(main)} with peers.</div>`; wirePeerControls(); return; }

  const cols = peerCols(), all = [me, ...peers];
  const ins = peerInsights(me, peers);
  html += `<section class="sec"><div class="sec-h"><div><span class="eyebrow">${esc(main)} vs ${peers.length} peer${peers.length > 1 ? "s" : ""}</span><h2>How it stacks up</h2></div></div>
    <div class="insights">${ins.map(i => `<article class="ins ${i.tone}"><span class="tag">${esc(i.tag)}</span><h3>${esc(i.title)}</h3><p>${i.body}</p></article>`).join("")}</div></section>`;

  // table
  const groups = []; cols.forEach(c => { const g = groups[groups.length - 1]; if (g && g.name === c.grp) g.n++; else groups.push({ name: c.grp, n: 1 }); });
  const medOf = c => c.val ? median(peers.map(c.get).filter(multOk)) : median(peers.map(c.get));
  const meds = cols.map(medOf);
  const tint = (c, v, mm) => { if (!c.better || !isNum(v) || !isNum(mm) || v === mm) return ""; const good = c.better === "high" ? v > mm : v < mm; return good ? "better" : "worse"; };
  const rowHtml = (x, isMe) => `<tr class="${isMe ? "me" : ""}"><td><b>${esc(x.sym)}</b> <span class="cn">${esc(x.name)}</span></td><td>${esc(x.label)}</td><td>${money(x.mktCap, x.tradeCur)}</td>
    ${cols.map((c, i) => { const v = c.get(x); return `<td class="${tint(c, v, meds[i])}">${c.f(v)}</td>`; }).join("")}</tr>`;
  const diffRow = `<tr class="vs"><td>${esc(main)} vs median</td><td></td><td></td>${cols.map((c, i) => {
    const v = c.get(me), mm = meds[i];
    if (c.val) return multOk(v) && isNum(mm) ? `<td>${pct(v / mm - 1, 0)} ${v > mm ? "premium" : "discount"}</td>` : "<td>—</td>";
    if (!isNum(v) || !isNum(mm)) return "<td>—</td>";
    return c.diff === "pp" ? `<td class="${c.better === "high" ? cls(v - mm) : ""}">${pp(v - mm)}</td>` : `<td>${Math.abs(v - mm) < 0.05 ? "0.0" : (v - mm > 0 ? "+" : "−") + Math.abs(v - mm).toFixed(1)}×</td>`;
  }).join("")}</tr>`;
  html += `<section class="sec"><div class="sec-h"><div><span class="eyebrow">Comparison table</span><h2>Growth, margins and valuation</h2>
      <p>Green and red mark better or worse than the peer median (median excludes ${esc(main)}). Valuation multiples are shown plain, with ${esc(main)}'s premium or discount in the last row. Each company's latest reported quarter is listed, as fiscal calendars differ.</p></div>
      <div class="seg" role="group" aria-label="Margin basis" id="peerMarginSeg"><button type="button" data-pm="q" aria-pressed="${(STATE.peerMargin || "q") === "q"}">Latest quarter</button><button type="button" data-pm="t" aria-pressed="${STATE.peerMargin === "t"}">TTM</button></div></div>
    <div class="tbl"><table class="peers"><thead>
      <tr class="gh"><th></th><th></th><th></th>${groups.map(g => `<th colspan="${g.n}">${esc(g.name)}</th>`).join("")}</tr>
      <tr><th>Company</th><th>Latest qtr</th><th>Mkt cap</th>${cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>
      ${rowHtml(me, true)}${peers.map(p => rowHtml(p, false)).join("")}
      <tr class="med"><td>Peer median</td><td></td><td></td>${cols.map((c, i) => `<td>${c.f(meds[i])}</td>`).join("")}</tr>
      ${diffRow}
    </tbody></table></div></section>`;

  // charts
  const yOpts = { evS: ["EV/Sales", x => x.evS], evE: ["EV/EBITDA", x => x.evE], fpe: ["Forward P/E", x => x.fpe], pe: ["P/E", x => x.pe] };
  const yk = STATE.peerY && yOpts[STATE.peerY] ? STATE.peerY : "evS", [yLab, yGet] = yOpts[yk];
  const gGet = x => MODE() === "qoq" ? x.revQoQ : x.revYoY, gName = `Revenue growth ${MODE() === "qoq" ? "QoQ" : "YoY"}`;
  const scatter = scatterChart(all.map(x => ({ x: x.revYoY, y: multOk(yGet(x)) ? yGet(x) : null, label: x.sym, me: x === me })), "Revenue growth YoY", yLab, v => pct(v, 0), v => v.toFixed(0) + "×");
  html += `<section class="sec"><div class="sec-h"><div><span class="eyebrow">Charts</span><h2>Growth against valuation</h2><p>Companies to the right grow faster; higher up means a richer multiple. Below the median line and right of it is the usual place to look for value.</p></div>
      <label class="note">Valuation <select id="peerY">${Object.entries(yOpts).map(([k, [l]]) => `<option value="${k}" ${k === yk ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>
    <div class="grid2"><div class="panel"><h4>${esc(yLab)} vs revenue growth YoY</h4><div class="chart">${scatter}</div></div>
      <div class="panel"><h4>${esc(gName)} <small>latest quarter</small></h4>${rankBars(all.map(x => ({ label: x.sym, v: gGet(x), me: x === me })), v => pct(v))}</div>
      <div class="panel"><h4>Operating margin <small>${(STATE.peerMargin || "q") === "q" ? "latest quarter" : "TTM"}</small></h4>${rankBars(all.map(x => ({ label: x.sym, v: (STATE.peerMargin || "q") === "q" ? x.omQ : x.omT, me: x === me })), v => pctPlain(v))}</div>
      <div class="panel"><h4>${esc(yLab)} <small>lower is cheaper</small></h4>${rankBars(all.map(x => ({ label: x.sym, v: multOk(yGet(x)) ? yGet(x) : null, me: x === me })), mult)}</div></div>
  </section>`;
  pane.innerHTML = html;
  wirePeerControls();
}

function peerControls(syms, errs) {
  const main = syms[0];
  return `<section class="sec peerctl"><div class="sec-h"><div><span class="eyebrow">Peer group</span><h2>Compare ${esc(main)} with peers</h2>
    <p>Starts from Financial Modeling Prep's suggested peers (US listings first). Add any ticker or remove one; your list is remembered for ${esc(main)}.</p></div></div>
    <div class="chips">
      <span class="chipx main">${esc(main)}</span>
      ${syms.slice(1).map(s => `<span class="chipx ${errs[s] ? "err" : ""}" title="${esc(errs[s] || "")}">${esc(s)}${errs[s] ? " · couldn't load" : ""}<button type="button" data-rm="${esc(s)}" aria-label="Remove ${esc(s)}">×</button></span>`).join("")}
      <form class="addpeer" id="addPeerForm" autocomplete="off"><input id="addPeerInput" placeholder="Add ticker, e.g. MSFT" aria-label="Add a peer ticker" spellcheck="false"><button class="btn ghost" type="submit" style="height:34px">Add</button><div class="sugg" id="addPeerSugg" hidden></div></form>
      <button class="btn ghost" type="button" id="resetPeers" style="height:34px">Reset to suggested</button>
    </div></section>`;
}

function savePeers() { try { store.set("peers:" + STATE.peerFor, JSON.stringify(STATE.peers)); } catch (e) {} }
function wirePeerControls() {
  const pane = document.getElementById("pane-peers"); if (!pane) return;
  pane.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { STATE.peers = STATE.peers.filter(s => s !== b.dataset.rm); savePeers(); renderPeers(); }));
  const inp = document.getElementById("addPeerInput"), sg = document.getElementById("addPeerSugg"), form = document.getElementById("addPeerForm");
  const add = sym => {
    sym = String(sym || "").trim().toUpperCase(); if (!sym) return;
    if (sym === STATE.peerFor || STATE.peers.includes(sym)) { inp.value = ""; return; }
    STATE.peers.push(sym); savePeers(); renderPeers();
  };
  if (inp) { attachSearch(inp, sg, add); form.addEventListener("submit", e => { e.preventDefault(); add(inp.value); }); }
  const rs = document.getElementById("resetPeers"); if (rs) rs.addEventListener("click", () => { STATE.peers = [...(STATE.suggested || [])]; savePeers(); renderPeers(); });
  pane.querySelectorAll("#peerMarginSeg button").forEach(b => b.addEventListener("click", () => { STATE.peerMargin = b.dataset.pm; store.set("peerMargin", b.dataset.pm); renderPeers(); }));
  const py = document.getElementById("peerY"); if (py) py.addEventListener("change", () => { STATE.peerY = py.value; renderPeers(); });
}

/* generic ticker autocomplete */
function attachSearch(input, sugg, onPick) {
  let timer = null, items = [], active = -1, seq = 0;
  const close = () => { sugg.hidden = true; active = -1; };
  const show = () => {
    if (!items.length) return close();
    sugg.innerHTML = items.map((it, i) => `<button type="button" data-s="${esc(it.symbol)}" class="${i === active ? "on" : ""}"><b>${esc(it.symbol)}</b><span>${esc(it.name)}${it.exchange ? " · " + esc(it.exchange) : ""}</span></button>`).join("");
    sugg.hidden = false;
    sugg.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", e => { e.preventDefault(); close(); input.value = ""; onPick(b.dataset.s); }));
  };
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const qv = input.value.trim(); if (qv.length < 1) return close();
    timer = setTimeout(async () => {
      const my = ++seq;
      const [a, b] = await Promise.all([api("search-symbol", { query: qv, limit: 6 }).catch(() => []), api("search-name", { query: qv, limit: 6 }).catch(() => [])]);
      if (my !== seq) return;
      const seen = new Set(); items = [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])].filter(x => x && x.symbol && !seen.has(x.symbol) && seen.add(x.symbol)).slice(0, 8)
        .map(x => ({ symbol: x.symbol, name: x.name, exchange: x.exchange || x.exchangeShortName }));
      active = -1; show();
    }, 220);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !sugg.hidden && active >= 0 && items[active]) { e.preventDefault(); const s = items[active].symbol; close(); input.value = ""; onPick(s); return; }
    if (sugg.hidden) return;
    if (e.key === "ArrowDown") { active = Math.min(items.length - 1, active + 1); show(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(-1, active - 1); show(); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
}

/* ============ search / UI wiring ============ */
(function wire() {
  const input = document.getElementById("tickerInput"), sugg = document.getElementById("sugg");
  attachSearch(input, sugg, sym => load(sym));
  document.getElementById("searchForm").addEventListener("submit", e => { e.preventDefault(); sugg.hidden = true; load(input.value); });
  STATE.tab = store.get("tab") === "peers" ? "peers" : "co";
  STATE.peerMargin = store.get("peerMargin") === "t" ? "t" : "q";
  const keyRow = document.getElementById("keyRow"), keyToggle = document.getElementById("keyToggle"), keyInput = document.getElementById("keyInput");
  keyInput.value = getKey();
  keyToggle.addEventListener("click", () => { keyRow.hidden = !keyRow.hidden; keyToggle.setAttribute("aria-expanded", String(!keyRow.hidden)); });
  document.getElementById("keySave").addEventListener("click", () => {
    store.set("fmpKey", keyInput.value.trim()); keyRow.hidden = true; keyToggle.setAttribute("aria-expanded", "false");
    load(store.get("lastTicker") || "AAPL");
  });
  STATE.incMode = store.get("incMode") || "values";
  STATE.cmp = store.get("cmpMode") === "yoy" ? "yoy" : "qoq";
  const cmpBtns = document.querySelectorAll("#cmpSeg button");
  const syncCmp = () => cmpBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === STATE.cmp)));
  syncCmp();
  cmpBtns.forEach(b => b.addEventListener("click", () => {
    if (STATE.cmp === b.dataset.c) return;
    STATE.cmp = b.dataset.c; store.set("cmpMode", STATE.cmp); syncCmp();
    if (STATE.d) { const y = window.scrollY; render(STATE.d); window.scrollTo(0, y); }
  }));
  let rsT = null, lastW = window.innerWidth;
  window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (window.innerWidth !== lastW && STATE.px && STATE.px.open) { lastW = window.innerWidth; renderPx(false); } }, 250); });
  const appEl = document.getElementById("app");
  appEl.addEventListener("click", e => {
    const t = e.target.closest("[data-evt],[data-pxmode],[data-pxrange],[data-pxclose]");
    if (!t || !STATE.d) return;
    if (t.dataset.evt) openPx("event", t.dataset.evt);
    else if (t.dataset.pxmode) openPx("general");
    else if (t.dataset.pxrange) { STATE.px.range = t.dataset.pxrange; renderPx(false); }
    else if (t.dataset.pxclose) { STATE.px.open = false; renderPx(false); const tb = document.querySelector("#forecast .tbl tr.clk"); if (tb) tb.closest(".panel").scrollIntoView({ block: "nearest" }); }
  });
  appEl.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const t = e.target.closest("[data-evt]"); if (!t || t.tagName === "BUTTON") return;
    e.preventDefault(); openPx("event", t.dataset.evt);
  });
  document.getElementById("app").addEventListener("change", e => {
    const t = e.target; if (!t.dataset || !t.dataset.sel || !STATE.d) return;
    STATE.segSel[t.dataset.sel] = +t.value;
    const y = window.scrollY; render(STATE.d); window.scrollTo(0, y);
    const again = document.getElementById("sel-" + t.dataset.sel); if (again) again.focus();
  });
  load(store.get("lastTicker") || "AAPL");
})();
