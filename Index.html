<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Equity Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky ticker bar, then summary-first reading order — verdict, KPIs, then each statement with its chart beside its table. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --sunk: #e9ebe6;
  --line: #d6d9d2;
  --ink: #171a17;
  --muted: #5d635b;
  --accent: #1f5c4a;
  --accent-soft: #dce9e3;
  --c1: #1f5c4a; --c2: #c27a2c; --c3: #3d6fb0; --c4: #8a4f9e; --c5: #b8484e; --c6: #6e8a2e; --c7: #4a8c95; --c8: #8c7a5b;
  --pos: #1d7a45; --pos-soft: #ddf0e3;
  --neg: #b23a32; --neg-soft: #f7e0dd;
  --neu: #6a6f68; --neu-soft: #eceee9;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111412; --surface: #191d1a; --sunk: #222723; --line: #323832; --ink: #e8ebe6; --muted: #9aa197;
    --accent: #6fc2a3; --accent-soft: #1f3a31;
    --c1: #6fc2a3; --c2: #e0a25e; --c3: #7aa6e0; --c4: #c08ad1; --c5: #e07f84; --c6: #a7c464; --c7: #78c0c9; --c8: #c4b08a;
    --pos: #5cc98a; --pos-soft: #1b3326; --neg: #ee7b72; --neg-soft: #3a211f; --neu: #a0a69d; --neu-soft: #262b27;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { font: 600 15px/1 var(--f-display); letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand i { width: 10px; height: 10px; background: var(--accent); display: inline-block; transform: rotate(45deg); }
.search { position: relative; flex: 1 1 320px; display: flex; gap: 8px; min-width: 0; }
.search input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .04em; }
.search input::placeholder { text-transform: none; letter-spacing: 0; font-family: var(--f-body); color: var(--muted); }
.btn { height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn:focus-visible, input:focus-visible, select:focus-visible, .seg button:focus-visible, .sugg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sugg { position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); overflow: hidden; z-index: 30; }
.sugg button { display: flex; width: 100%; gap: 12px; align-items: baseline; padding: 9px 12px; background: none; border: 0; text-align: left; cursor: pointer; }
.sugg button:hover, .sugg button.on { background: var(--sunk); }
.sugg b { font-family: var(--f-mono); font-weight: 500; min-width: 64px; }
.sugg span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.keyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; }
.keyrow input { height: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-family: var(--f-mono); font-size: 13px; width: min(360px, 100%); }
.keyrow small { color: var(--muted); }

main { padding-block: 28px 64px; display: grid; gap: 40px; }
.status { padding: 14px 16px; border-radius: 6px; background: var(--sunk); color: var(--muted); }
.status.err { background: var(--neg-soft); color: var(--neg); }

/* company header */
.co { display: grid; grid-template-columns: 1fr auto; gap: 16px 32px; align-items: end; }
.co h1 { font: 700 clamp(28px, 4.4vw, 44px)/1.05 var(--f-display); margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.co .tick { font-family: var(--f-mono); font-size: 14px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.co .tick b { color: var(--accent); font-weight: 500; }
.price { text-align: right; font-family: var(--f-mono); }
.price .p { font-size: 26px; }
.price .m { color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { .co { grid-template-columns: 1fr; } .price { text-align: left; } }

/* section heads */
.sec { display: grid; gap: 16px; }
.sec-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 20px; border-top: 2px solid var(--ink); padding-top: 12px; }
.sec-h h2 { font: 600 22px/1.15 var(--f-display); margin: 0; letter-spacing: -.005em; }
.sec-h p { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* verdict */
.verdict { font: 500 clamp(18px, 2.2vw, 22px)/1.45 var(--f-display); max-width: 62ch; margin: 0; text-wrap: pretty; }
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.ins { background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: 4px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.ins.pos { border-left-color: var(--pos); }
.ins.neg { border-left-color: var(--neg); }
.ins.neu { border-left-color: var(--neu); }
.ins .tag { font: 500 10.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ins h3 { margin: 0; font: 600 16px/1.3 var(--f-display); }
.ins p { margin: 0; color: var(--muted); font-size: 14px; }
.ins p b { color: var(--ink); font-weight: 600; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.kpi { padding: 14px 16px; border-right: 1px solid var(--line); display: grid; gap: 4px; min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .v { font: 500 22px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi .d { font: 12.5px/1.3 var(--f-mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }

.chip { font: 500 12px/1 var(--f-mono); padding: 3px 6px; border-radius: 3px; white-space: nowrap; }
.up { color: var(--pos); } .dn { color: var(--neg); }
.chip.up { background: var(--pos-soft); } .chip.dn { background: var(--neg-soft); }

/* panels */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.panel h4 { margin: 0; font: 600 14px/1.2 var(--f-display); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel h4 small { font: 400 12px var(--f-body); color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--f-mono); fill: var(--muted); font-size: 10.5px; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* segmented control */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td { font-family: var(--f-mono); font-size: 13px; }
th { font: 500 11.5px/1.2 var(--f-mono); color: var(--muted); letter-spacing: .03em; border-bottom: 1px solid var(--line); background: var(--sunk); position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); font-family: var(--f-body); font-size: 13.5px; z-index: 1; }
th:first-child { background: var(--sunk); z-index: 2; }
tr + tr td { border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
tr.strong td { font-weight: 600; }
tr.strong td:first-child { font-weight: 600; }
tr.sub td:first-child { padding-left: 24px; color: var(--muted); }
tr.grp td { background: var(--sunk); font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 10px; padding-bottom: 8px; }
td.na { color: var(--muted); }
td .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 8px; vertical-align: 1px; }
.note { font-size: 13px; color: var(--muted); margin: 0; max-width: 80ch; }
.note b { color: var(--ink); font-weight: 600; }

/* balance sheet map */
.bsmap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bscol { display: grid; gap: 6px; }
.bscol .lbl { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.stack { display: flex; flex-direction: column; height: 300px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.stack div { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; color: #fff; font-size: 12px; min-height: 0; overflow: hidden; white-space: nowrap; }
.stack div span:last-child { font-family: var(--f-mono); }

.cmp { display: flex; align-items: center; gap: 8px; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

/* segment growth breakdown */
.gblock { display: grid; gap: 14px; }
.gblock + .gblock { margin-top: 18px; }
.ghead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.ghead h3 { margin: 0; font: 600 18px/1.2 var(--f-display); }
.ghead select { height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 8px; font-size: 13px; }
.gsum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.gsum .big { font: 500 clamp(28px, 4vw, 38px)/1 var(--f-mono); letter-spacing: -.02em; }
.gsum .cap { color: var(--muted); font-size: 14px; max-width: 60ch; }
.gsum .cap b { color: var(--ink); font-weight: 600; }
.banner { background: var(--neu-soft); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); }
.banner b { color: var(--ink); }
.bridge { display: grid; gap: 7px; }
.br { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr) minmax(0, 150px); gap: 10px; align-items: center; font-size: 13px; }
.br .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br.tot .nm { font-weight: 600; }
.br .track { position: relative; height: 20px; background: var(--sunk); border-radius: 3px; }
.br .track i { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; }
.br .vals { font-family: var(--f-mono); font-size: 12.5px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.br .vals b { font-weight: 600; margin-left: 6px; }
@media (max-width: 560px) { .br { grid-template-columns: minmax(0, 1fr) auto; } .br .track { grid-column: 1 / -1; grid-row: 2; } }
.dbar { display: block; position: relative; width: 120px; height: 12px; margin-left: auto; }
.dbar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.dbar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
td.big { font-size: 14.5px; font-weight: 600; }
.heat td:not(:first-child) { min-width: 78px; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: -12px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 10px 14px; font: 600 15px/1.2 var(--f-display); color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pane { display: grid; gap: 40px; min-width: 0; }

/* forecast */
.fcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.fc { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.fc .v { font: 500 26px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.fc .d { font: 12.5px/1.3 var(--f-mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.fc .foot { font-size: 12.5px; color: var(--muted); }
.fc:first-child { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pt { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.pthead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.pt .v { font: 500 22px/1.1 var(--f-mono); margin-right: 10px; }
.pt .d { font: 12.5px var(--f-mono); color: var(--muted); }
.ptbar { position: relative; height: 18px; background: var(--sunk); border-radius: 9px; }
.ptbar .rng { position: absolute; top: 5px; height: 8px; background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 4px; }
.ptbar .tk { position: absolute; top: 1px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; }
.tk.cons, .dot.cons { background: var(--accent); }
.tk.px, .dot.px { background: var(--ink); }
.ptlab { display: flex; justify-content: space-between; gap: 8px; font: 11.5px var(--f-mono); color: var(--muted); flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin: 0 4px 0 8px; }

/* peers */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chipx { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 5px 4px 12px; font: 500 13px/1.4 var(--f-mono); }
.chipx.main { background: var(--accent-soft); border-color: var(--accent); padding-right: 12px; }
.chipx.err { border-color: var(--neg); color: var(--neg); }
.chipx button { border: 0; background: var(--sunk); color: var(--ink); border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 14px; line-height: 1; }
.chipx button:hover { background: var(--neg-soft); color: var(--neg); }
.addpeer { position: relative; display: flex; gap: 6px; }
.addpeer input { height: 34px; width: min(220px, 60vw); padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--f-mono); text-transform: uppercase; }
.addpeer input::placeholder { text-transform: none; font-family: var(--f-body); color: var(--muted); }
.addpeer .sugg { top: 38px; min-width: 300px; }
table.peers .cn { color: var(--muted); font-size: 12px; margin-left: 4px; }
tr.gh th { background: var(--surface); text-align: center; border-bottom: 0; letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; }
tr.gh th + th { border-left: 1px solid var(--line); }
tr.me td, tr.me td:first-child { background: var(--accent-soft); font-weight: 600; }
tr.med td { border-top: 2px solid var(--line); color: var(--muted); }
tr.vs td { font-size: 12px; color: var(--muted); }
td.better { background: color-mix(in srgb, var(--pos) 16%, transparent); }
td.worse { background: color-mix(in srgb, var(--neg) 13%, transparent); }
tr.me td.better { background: color-mix(in srgb, var(--pos) 26%, var(--accent-soft)); }
tr.me td.worse { background: color-mix(in srgb, var(--neg) 22%, var(--accent-soft)); }
.br.me .nm, .br.me .vals { font-weight: 700; color: var(--accent); }
.peerctl { gap: 12px; }

/* price reaction panel */
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
tr.clk { cursor: pointer; }
tr.clk:hover td, tr.clk:focus-visible td { background: var(--sunk); }
tr.clk:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.clk .go { color: var(--muted); font-size: 11px; margin-left: 4px; }
.colhit, .mk { cursor: pointer; }
.colhit:hover { fill: color-mix(in srgb, var(--accent) 8%, transparent); }
.colhit:focus-visible, .mk:focus-visible { outline: 2px solid var(--accent); }
.pxpanel { border-color: var(--accent); gap: 14px; scroll-margin-top: 96px; }
.pxhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 16px; }
.pxt { margin: 4px 0 0; font: 600 18px/1.25 var(--f-display); }
.pxt small { font: 400 13px var(--f-body); color: var(--muted); margin-left: 6px; }
.pxbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pxstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 10px; }
.pxstat { background: var(--sunk); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.pxstat .v { font: 500 22px/1.1 var(--f-mono); }
.pxstat .foot { font: 11.5px/1.3 var(--f-mono); color: var(--muted); }
.pxread { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12.5px/1.4 var(--f-mono); color: var(--muted); min-height: 18px; font-variant-numeric: tabular-nums; }
.pxread b { color: var(--ink); font-weight: 600; }
.pxchart svg { touch-action: pan-y; }
.pxchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pxchip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 6px; font: 500 12.5px var(--f-mono); cursor: pointer; }
.pxchip span { color: var(--muted); font-weight: 400; margin-left: 4px; }
.pxchip.on { border-color: var(--accent); background: var(--accent-soft); }
.pxchip:hover { border-color: var(--accent); }
.pxchip .dot { margin: 0 2px 0 4px; }

.skel { height: 120px; border-radius: 6px; background: linear-gradient(90deg, var(--sunk), var(--surface), var(--sunk)); background-size: 200% 100%; animation: sh 1.4s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="brand"><i></i>Equity Monitor</div>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="tickerInput" placeholder="Ticker or company name — e.g. MSFT, Nvidia" aria-label="Ticker or company name" spellcheck="false">
      <button class="btn" type="submit">Analyse</button>
      <button class="btn ghost" type="button" id="keyToggle" aria-expanded="false">API key</button>
      <div class="sugg" id="sugg" hidden></div>
    </form>
    <div class="cmp"><span class="eyebrow">Compare</span>
      <div class="seg" role="group" aria-label="Compare periods" id="cmpSeg">
        <button type="button" data-c="qoq" aria-pressed="true" title="Quarter on quarter: vs the previous quarter">QoQ</button>
        <button type="button" data-c="yoy" aria-pressed="false" title="Year on year: vs the same quarter last year">YoY</button>
      </div>
    </div>
  </div>
  <div class="wrap keyrow" id="keyRow" hidden>
    <input id="keyInput" aria-label="Financial Modeling Prep API key" spellcheck="false">
    <button class="btn ghost" type="button" id="keySave" style="height:34px">Save key</button>
    <small>Financial Modeling Prep key, saved in this browser only.</small>
  </div>
</header>

<div class="wrap">
  <main id="app">
    <div class="skel"></div>
  </main>
</div>

<script>
"use strict";
/* ============ config ============ */
const DEFAULT_KEY = "3URryNYomrF4STDsjWcuROvHcpZp4vEE";
const BASE = "https://financialmodelingprep.com/stable/";
const SHOW_Q = 8;          // quarters displayed
const FETCH_Q = 13;        // fetched (extra for YoY on the oldest shown + TTM compare)
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const getKey = () => store.get("fmpKey") || DEFAULT_KEY;

/* ============ formatting ============ */
const isNum = v => typeof v === "number" && isFinite(v);
function money(v, cur) {
  if (!isNum(v)) return "—";
  const s = v < 0 ? "−" : "", a = Math.abs(v);
  const sym = (cur === "USD" || !cur) ? "$" : "";
  const suf = (cur && cur !== "USD") ? " " + cur : "";
  let out;
  if (a >= 1e12) out = (a / 1e12).toFixed(2) + "T";
  else if (a >= 1e9) out = (a / 1e9).toFixed(a >= 1e11 ? 1 : 2) + "B";
  else if (a >= 1e6) out = (a / 1e6).toFixed(a >= 1e8 ? 0 : 1) + "M";
  else if (a >= 1e3) out = (a / 1e3).toFixed(0) + "K";
  else out = a.toFixed(2);
  return s + sym + out + suf;
}
function pct(v, d = 1, sign = true) {
  if (!isNum(v)) return "—";
  const x = v * 100;
  return (sign && x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d) + "%";
}
const pctPlain = (v, d = 1) => isNum(v) ? (v * 100).toFixed(d) + "%" : "—";
function bps(v) { if (!isNum(v)) return "—"; const b = Math.round(v * 10000); return (b > 0 ? "+" : b < 0 ? "−" : "") + Math.abs(b) + " bps"; }
function pp(v) { if (!isNum(v)) return "—"; const x = v * 100; return (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(1) + " pp"; }
const cls = v => !isNum(v) ? "" : v > 0 ? "up" : v < 0 ? "dn" : "";
const chip = (v, f = pct) => isNum(v) ? `<span class="chip ${cls(v)}">${f(v)}</span>` : `<span class="chip">—</span>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ============ maths ============ */
function growth(a, b) { if (!isNum(a) || !isNum(b) || b === 0) return null; return (a - b) / Math.abs(b); }
function ratio(a, b) { if (!isNum(a) || !isNum(b) || b === 0) return null; return a / b; }
const sum = arr => arr.every(isNum) && arr.length ? arr.reduce((s, x) => s + x, 0) : null;
const mean = arr => { const f = arr.filter(isNum); return f.length ? f.reduce((s, x) => s + x, 0) / f.length : null; };
const qLabel = r => r.period === "FY" ? "FY" + String(r.fiscalYear).slice(-2) : `${r.period} FY${String(r.fiscalYear).slice(-2)}`;
const n0 = v => isNum(v) ? v : 0;

/* attach derived fields to each income-statement row (ascending order) */
function enrichIncome(rows) {
  rows.forEach((r, i) => {
    r.label = qLabel(r);
    r.gm = ratio(r.grossProfit, r.revenue);
    r.om = ratio(r.operatingIncome, r.revenue);
    r.nm = ratio(r.netIncome, r.revenue);
    r.taxRate = ratio(r.incomeTaxExpense, r.incomeBeforeTax);
    r.rdPct = ratio(r.researchAndDevelopmentExpenses, r.revenue);
    r.sgaPct = ratio(r.sellingGeneralAndAdministrativeExpenses, r.revenue);
    r.cogsPct = ratio(r.costOfRevenue, r.revenue);
    r.opexPct = ratio(r.operatingExpenses, r.revenue);
    const p = rows[i - 1], y = rows[i - 4];
    r.revQoQ = p ? growth(r.revenue, p.revenue) : null;
    r.revYoY = y ? growth(r.revenue, y.revenue) : null;
  });
  return rows;
}

/* index of the same quarter one year earlier, by fiscal year + period, falling back to i-4 */
function yearAgoIdx(rows, i) {
  const r = rows[i];
  for (let j = i - 1; j >= 0; j--) if (rows[j].period === r.period && rows[j].fiscalYear === r.fiscalYear - 1) return j;
  return i - 4 >= 0 ? i - 4 : -1;
}

/* segments: normalise FMP segmentation into ascending periods */
function normSegments(raw, mode) {
  if (!Array.isArray(raw) || !raw.length) return null;
  const rows = raw.filter(r => r && r.data && typeof r.data === "object")
    .map(r => ({ date: r.date, fiscalYear: r.fiscalYear, period: r.period || "FY", data: r.data, label: qLabel({ period: r.period || "FY", fiscalYear: r.fiscalYear }) }))
    .sort((a, b) => a.date < b.date ? -1 : 1);
  if (!rows.length) return null;
  const keep = rows.slice(-(mode === "quarter" ? SHOW_Q + 4 : 6));
  const latest = keep[keep.length - 1];
  const names = new Set(); keep.slice(-(mode === "quarter" ? SHOW_Q : 5)).forEach(r => Object.keys(r.data).forEach(k => names.add(k)));
  const ordered = [...names].sort((a, b) => n0(latest.data[b]) - n0(latest.data[a]));
  return { mode, rows: keep, names: ordered };
}

const MODE = () => STATE.cmp || "qoq";
/* which earlier row a segment period is compared with */
function segCmpIdx(seg, i, mode) {
  if (seg.mode !== "quarter") return i - 1;
  return mode === "yoy" ? yearAgoIdx(seg.rows, i) : i - 1;
}
const segEffMode = (seg, mode) => seg.mode !== "quarter" ? "fy" : mode;
const modeWord = m => m === "qoq" ? "QoQ" : m === "yoy" ? "YoY" : "vs prior year";

function segmentAnalysis(seg, mode, idx) {
  if (!seg || seg.rows.length < 2) return null;
  const rows = seg.rows, L = isNum(idx) ? idx : rows.length - 1;
  const j = segCmpIdx(seg, L, mode);
  if (j < 0) return null;
  const cur = rows[L], prev = rows[j], names = seg.names;
  const totCur = names.reduce((t, n) => t + n0(cur.data[n]), 0);
  const totPrev = names.reduce((t, n) => t + n0(prev.data[n]), 0);
  const dTot = totCur - totPrev;
  const items = names.map(n => {
    const c = cur.data[n], p = prev.data[n];
    const delta = (isNum(c) || isNum(p)) ? n0(c) - n0(p) : null;
    return {
      name: n, cur: c, prev: p, delta,
      chg: growth(c, p), isNew: isNum(c) && !isNum(p),
      contribPP: isNum(delta) && totPrev ? delta / totPrev : null,       // percentage points of total growth
      shareOfGrowth: isNum(delta) && dTot ? delta / Math.abs(dTot) : null,
      share: ratio(n0(c), totCur), sharePrev: ratio(n0(p), totPrev)
    };
  }).filter(it => isNum(it.cur) || isNum(it.prev));
  items.forEach(it => it.shareChg = isNum(it.share) && isNum(it.sharePrev) ? it.share - it.sharePrev : null);
  const eff = segEffMode(seg, mode);
  return { cur, prev, idx: L, totCur, totPrev, dTot, totGrowth: growth(totCur, totPrev), items, eff, cmpLabel: modeWord(eff) };
}

/* ============ insights ============ */
function buildInsights(d) {
  const out = [];
  const q = d.inc, n = q.length, L = q[n - 1], P = q[n - 2];
  const yi = yearAgoIdx(q, n - 1), Y = yi >= 0 ? q[yi] : null;
  const cur = d.currency;
  const add = (tone, tag, title, body) => out.push({ tone, tag, title, body });

  /* revenue */
  const r0 = L.revYoY, r1 = P ? P.revYoY : null, qoq = L.revQoQ;
  const seasonal = (yi >= 1) ? growth(q[yi].revenue, q[yi - 1].revenue) : null;
  const accel = () => isNum(r1) ? (Math.abs(r0 - r1) < 0.01 ? `steady against ${pct(r1)} last quarter` : `<b>${r0 > r1 ? "accelerating" : "slowing"}</b> from ${pct(r1)} in ${P.label}`) : "";
  if (MODE() === "qoq" && isNum(qoq)) {
    let body = `${L.label} revenue was <b>${money(L.revenue, cur)}</b> against ${money(P.revenue, cur)} in ${P.label}, a change of ${money(L.revenue - P.revenue, cur)}.`;
    if (isNum(seasonal)) body += Math.abs(qoq - seasonal) < 0.015 ? ` The same quarter last year moved ${pct(seasonal)}, so this is in line with normal seasonality.` :
      ` The same quarter last year moved ${pct(seasonal)}, so this quarter was <b>${qoq > seasonal ? "stronger" : "weaker"}</b> than the usual seasonal pattern.`;
    if (isNum(r0)) body += ` Year on year: ${pct(r0)}${accel() ? ", " + accel() : ""}.`;
    add(qoq > 0 ? "pos" : isNum(seasonal) && qoq >= seasonal - 0.015 ? "neu" : "neg", "Top line · QoQ", `Revenue ${qoq >= 0 ? "up" : "down"} ${pct(qoq, 1, false).replace("−", "")} quarter on quarter`, body);
  } else if (isNum(r0)) {
    let body = `${L.label} revenue was <b>${money(L.revenue, cur)}</b> versus ${money(Y.revenue, cur)} a year earlier.`;
    if (accel()) body += ` Growth is ${accel()}.`;
    if (isNum(qoq)) body += ` Sequentially ${pct(qoq)} QoQ${isNum(seasonal) ? ` (same quarter last year: ${pct(seasonal)})` : ""}.`;
    add(r0 > 0 ? "pos" : "neg", "Top line · YoY", `Revenue ${r0 >= 0 ? "up" : "down"} ${pct(r0, 1, false).replace("−", "")} year on year`, body);
  }

  forecastInsight(d.fc, cur, add);

  /* margins */
  if (Y && isNum(L.om) && isNum(Y.om)) {
    const dOm = L.om - Y.om, dGm = isNum(L.gm) && isNum(Y.gm) ? L.gm - Y.gm : null;
    let body = `Operating margin is <b>${pctPlain(L.om)}</b> (${bps(dOm)} YoY, ${bps(P && isNum(P.om) ? L.om - P.om : null)} QoQ).`;
    if (isNum(dGm) && L.grossProfit) body += ` Gross margin ${dGm >= 0 ? "widened" : "narrowed"} ${bps(dGm).replace(/^[+−]/, "")} to ${pctPlain(L.gm)}, ${Math.abs(dGm) > Math.abs(dOm) * 0.6 ? "so pricing and product costs explain most of the move." : "so most of the change came below gross profit, in operating costs."}`;
    const dRev = L.revenue - Y.revenue, dOI = L.operatingIncome - Y.operatingIncome;
    if (dRev > 0 && isNum(dOI)) {
      const inc = dOI / dRev;
      body += ` Each extra dollar of revenue added <b>${inc.toFixed(2)}</b> dollars of operating profit${inc > L.om ? ", above the average margin, which is operating leverage." : "."}`;
    }
    add(dOm >= 0.0025 ? "pos" : dOm <= -0.0025 ? "neg" : "neu", "Profitability", `Margins ${dOm >= 0.0025 ? "expanding" : dOm <= -0.0025 ? "compressing" : "holding flat"}`, body);
  }

  /* cost discipline */
  if (Y && isNum(L.operatingExpenses) && isNum(Y.operatingExpenses) && Y.operatingExpenses) {
    const og = growth(L.operatingExpenses, Y.operatingExpenses), rg = r0;
    const rd = growth(L.researchAndDevelopmentExpenses, Y.researchAndDevelopmentExpenses);
    const sga = growth(L.sellingGeneralAndAdministrativeExpenses, Y.sellingGeneralAndAdministrativeExpenses);
    let body = `Operating expenses grew <b>${pct(og)}</b> against revenue ${pct(rg)}.`;
    if (isNum(rd) && L.researchAndDevelopmentExpenses) body += ` R&amp;D ${pct(rd)} (now ${pctPlain(L.rdPct)} of revenue)`;
    if (isNum(sga) && L.sellingGeneralAndAdministrativeExpenses) body += `${isNum(rd) && L.researchAndDevelopmentExpenses ? "," : ""} SG&amp;A ${pct(sga)} (${pctPlain(L.sgaPct)} of revenue).`;
    else body += ".";
    if (isNum(og) && isNum(rg)) { const inLine = Math.abs(og - rg) < 0.01; add(inLine ? "neu" : og < rg ? "pos" : "neg", "Costs", inLine ? "Costs growing in line with sales" : og < rg ? "Costs growing slower than sales" : "Costs outpacing sales", body); }
  }

  /* earnings & share count */
  if (Y) {
    const eg = growth(L.epsDiluted, Y.epsDiluted), ng = growth(L.netIncome, Y.netIncome), sh = growth(L.weightedAverageShsOutDil, Y.weightedAverageShsOutDil);
    if (isNum(eg) || isNum(ng)) {
      let body = `Net income ${money(L.netIncome, cur)} (${pct(ng)} YoY), diluted EPS <b>${isNum(L.epsDiluted) ? L.epsDiluted.toFixed(2) : "—"}</b> (${pct(eg)}).`;
      if (isNum(sh)) body += sh < -0.005 ? ` Share count fell ${pct(sh, 1, false).replace("−", "")}, so buybacks are adding to per-share growth.` : sh > 0.005 ? ` Diluted shares rose ${pct(sh)}, which dilutes per-share growth.` : " Share count was roughly flat.";
      if (isNum(L.taxRate) && isNum(Y.taxRate) && Math.abs(L.taxRate - Y.taxRate) > 0.03) body += ` Note the tax rate moved from ${pctPlain(Y.taxRate)} to ${pctPlain(L.taxRate)}, which distorts the comparison.`;
      add((isNum(eg) ? eg : ng) >= 0 ? "pos" : "neg", "Earnings", `EPS ${(isNum(eg) ? eg : ng) >= 0 ? "growing" : "declining"} ${pct(isNum(eg) ? eg : ng, 1, false).replace("−", "")} YoY`, body);
    }
  }

  /* segments */
  const segText = (sa, kind, seg) => {
    if (!sa) return;
    // seasonal reference for QoQ: same comparison one year earlier
    let seasonal = null;
    if (sa.eff === "qoq") {
      const yi2 = yearAgoIdx(seg.rows, sa.idx);
      if (yi2 >= 1) { const t = x => seg.names.reduce((s2, n) => s2 + n0(x.data[n]), 0); seasonal = growth(t(seg.rows[yi2]), t(seg.rows[yi2 - 1])); }
    }
    const big = sa.items.filter(i => isNum(i.share) && i.share >= 0.03);
    const byDelta = [...sa.items].filter(i => isNum(i.delta)).sort((a, b) => b.delta - a.delta);
    const top = sa.dTot >= 0 ? byDelta[0] : byDelta[byDelta.length - 1];
    if (!top) return;
    const fastest = big.filter(i => isNum(i.chg)).sort((a, b) => b.chg - a.chg)[0];
    const decliners = big.filter(i => isNum(i.chg) && i.chg < 0);
    const mix = big.filter(i => isNum(i.shareChg)).sort((a, b) => Math.abs(b.shareChg) - Math.abs(a.shareChg))[0];
    const w = sa.cmpLabel;
    let body = `Total ${kind === "segment" ? "segment" : "regional"} revenue <b>${pct(sa.totGrowth)} ${w}</b> (${sa.cur.label} vs ${sa.prev.label}). `;
    if (sa.dTot > 0) body += `<b>${esc(top.name)}</b> ${top.isNew ? "is new and" : `grew ${pct(top.chg)} and`} added ${pp(top.contribPP)} of that, ${pctPlain(top.shareOfGrowth, 0)} of the ${money(sa.dTot, cur)} increase.`;
    else body += `<b>${esc(top.name)}</b> was the biggest drag at ${pct(top.chg)} (${pp(top.contribPP)}).`;
    if (fastest && fastest.name !== top.name) body += fastest.chg > 0 ? ` Fastest: ${esc(fastest.name)} ${pct(fastest.chg)}.` : ` Held up best: ${esc(fastest.name)} ${pct(fastest.chg)}.`;
    const dl = decliners.filter(i => i.name !== top.name && !(fastest && i.name === fastest.name));
    if (dl.length) body += ` Declining: ${dl.map(i => `${esc(i.name)} ${pct(i.chg)}`).join(", ")}.`;
    if (mix && Math.abs(mix.shareChg) >= 0.005) body += ` Mix: ${esc(mix.name)} now ${pctPlain(mix.share)} of revenue (${pp(mix.shareChg)}).`;
    const inSeason = isNum(seasonal) && Math.abs(sa.totGrowth - seasonal) < 0.015;
    if (isNum(seasonal)) body += ` Same quarter last year the total moved ${pct(seasonal)}, so this is ${inSeason ? "in line with normal seasonality" : sa.totGrowth > seasonal ? "<b>stronger</b> than the usual seasonal pattern" : "<b>weaker</b> than the usual seasonal pattern"}.`;
    add(sa.dTot > 0 ? "pos" : (sa.dTot < 0 && !inSeason) ? "neg" : "neu", `${kind === "segment" ? "Business units" : "Geography"} · ${w}`,
      sa.dTot > 0 ? `${top.name} is the main growth driver` : `${top.name} is dragging ${kind === "segment" ? "segment" : "regional"} revenue down`, body);
  };
  segText(d.segL, "segment", d.seg);
  segText(d.geoL, "region", d.geo);

  /* cash flow */
  const c = d.cf;
  if (c.length >= 8) {
    const t = c.slice(-4), tp = c.slice(-8, -4);
    const fcf = sum(t.map(x => x.freeCashFlow)), fcfP = sum(tp.map(x => x.freeCashFlow));
    const ni = sum(q.slice(-4).map(x => x.netIncome)), rev = sum(q.slice(-4).map(x => x.revenue));
    const capex = sum(t.map(x => Math.abs(n0(x.capitalExpenditure)))), capexP = sum(tp.map(x => Math.abs(n0(x.capitalExpenditure))));
    const revP = sum(q.slice(-8, -4).map(x => x.revenue));
    if (isNum(fcf)) {
      const conv = ratio(fcf, ni);
      let body = `Trailing-12-month free cash flow <b>${money(fcf, cur)}</b> (${pct(growth(fcf, fcfP))} vs the prior 12 months), a ${pctPlain(ratio(fcf, rev))} FCF margin.`;
      if (isNum(conv)) body += ` That is ${pctPlain(conv, 0)} of net income${conv < 0.8 ? ", so earnings are converting to cash less fully than usual." : "."}`;
      const ci = ratio(capex, rev), ciP = ratio(capexP, revP);
      if (isNum(ci) && isNum(ciP)) body += ` Capex runs at ${pctPlain(ci)} of revenue (${pp(ci - ciP)} YoY)${ci - ciP > 0.02 ? ", a step-up in investment." : "."}`;
      const buy = sum(t.map(x => Math.abs(n0(x.commonStockRepurchased)))), div = sum(t.map(x => Math.abs(n0(x.commonDividendsPaid))));
      if (buy > 0 || div > 0) body += ` Returned ${money(buy + div, cur)} via buybacks and dividends.`;
      add(fcf > 0 && (!isNum(fcfP) || fcf >= fcfP) ? "pos" : fcf > 0 ? "neu" : "neg", "Cash generation", fcf > 0 ? (isNum(fcfP) && fcf < fcfP ? "Cash generation softer than last year" : "Strong cash generation") : "Burning cash", body);
    }
  }

  /* balance sheet */
  const b = d.bs;
  if (b.length >= 2) {
    const bL = b[b.length - 1], byi = b.length - 5 >= 0 ? b.length - 5 : 0, bY = b[byi];
    const nd = bL.netDebt, ndY = bY.netDebt;
    let body = isNum(nd) ? (nd < 0 ? `Net cash of <b>${money(-nd, cur)}</b>` : `Net debt of <b>${money(nd, cur)}</b>`) + ` (was ${isNum(ndY) ? (ndY < 0 ? "net cash " + money(-ndY, cur) : "net debt " + money(ndY, cur)) : "—"} a year ago).` : "";
    const cr = ratio(bL.totalCurrentAssets, bL.totalCurrentLiabilities);
    if (isNum(cr)) body += ` Current ratio ${cr.toFixed(2)}.`;
    const tone = isNum(nd) && isNum(ndY) ? (nd <= ndY ? "pos" : "neu") : "neu";
    const invG = growth(bL.inventory, bY.inventory), arG = growth(bL.netReceivables, bY.netReceivables), drG = growth(bL.deferredRevenue, bY.deferredRevenue);
    const flags = [];
    if (isNum(invG) && isNum(r0) && bL.inventory > 0.02 * bL.totalAssets && invG - r0 > 0.1) flags.push(`inventory up ${pct(invG)} vs sales ${pct(r0)}, worth watching for demand softness`);
    if (isNum(arG) && isNum(r0) && arG - r0 > 0.12) flags.push(`receivables up ${pct(arG)}, faster than sales`);
    if (isNum(drG) && isNum(r0) && bL.deferredRevenue > 0.02 * bL.totalAssets && drG > r0 + 0.03) flags.push(`deferred revenue up ${pct(drG)}, a sign of future revenue already booked`);
    if (flags.length) body += " Watch: " + flags.join("; ") + ".";
    add(flags.some(f => f.includes("watching") || f.includes("faster than")) ? "neg" : tone, "Balance sheet", isNum(nd) ? (nd < 0 ? "Net cash position" : (isNum(ndY) && nd < ndY ? "Deleveraging" : "Carrying net debt")) : "Balance sheet", body);
  }

  /* headline */
  let verdict = "";
  if (isNum(r0)) {
    const segLead = d.segL && d.segL.dTot > 0 ? [...d.segL.items].filter(i => isNum(i.delta)).sort((a, b) => b.delta - a.delta)[0] : null;
    const nm = d.profile.companyName || d.symbol;
    if (MODE() === "qoq" && isNum(qoq)) verdict = `${nm} revenue moved ${pct(qoq)} QoQ in ${L.label} (${pct(r0)} YoY)`;
    else { verdict = `${nm} grew revenue ${pct(r0)} YoY in ${L.label}`; if (isNum(r1)) verdict += ` (${r0 > r1 + 0.01 ? "accelerating" : r0 < r1 - 0.01 ? "decelerating" : "steady"})`; }
    if (segLead) verdict += `. ${segLead.name} added the most revenue ${d.segL.cmpLabel === "vs prior year" ? "over the last fiscal year" : d.segL.cmpLabel}`;
    if (Y && isNum(L.om) && isNum(Y.om)) verdict += `${segLead ? ". Operating margin is" : ", with operating margin"} ${L.om - Y.om >= 0.0025 ? "expanding" : L.om - Y.om <= -0.0025 ? "contracting" : "flat"} at ${pctPlain(L.om)}`;
    const eg = Y ? growth(L.epsDiluted, Y.epsDiluted) : null;
    if (isNum(eg)) verdict += ` and EPS ${pct(eg)}`;
    verdict += ".";
  }
  return { verdict, list: out };
}

/* ============ SVG charts ============ */
function niceTicks(min, max, count = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || mag * 10;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
const W = 640, H = 260, M = { t: 18, r: 12, b: 28, l: 56 };

function barChart(labels, series, opts = {}) {
  // series: [{name,color,values}] grouped or stacked
  const stacked = !!opts.stacked, fmt = opts.fmt || (v => money(v));
  const all = [];
  labels.forEach((_, i) => {
    if (stacked) { let p = 0, ng = 0; series.forEach(s => { const v = n0(s.values[i]); if (v >= 0) p += v; else ng += v; }); all.push(p, ng); }
    else series.forEach(s => all.push(n0(s.values[i])));
    if (opts.marks && isNum(opts.marks[i])) all.push(opts.marks[i]);
    if (opts.marks2 && isNum(opts.marks2[i])) all.push(opts.marks2[i]);
  });
  const ticks = niceTicks(Math.min(0, ...all), Math.max(0, ...all));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const mt = M.t + (opts.topPad || 0);
  const iw = W - M.l - M.r, ih = H - mt - M.b;
  const Y = v => mt + ih - (v - y0) / (y1 - y0) * ih;
  const bw = iw / labels.length, gap = Math.min(14, bw * 0.25);
  let g = ticks.map(t => `<line class="gl" x1="${M.l}" x2="${W - M.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${M.l - 8}" y="${Y(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`).join("");
  labels.forEach((lab, i) => {
    const x = M.l + i * bw + gap / 2, w = bw - gap;
    if (stacked) {
      let pos = 0, neg = 0;
      series.forEach(s => {
        const v = n0(s.values[i]); if (!v) return;
        const a = v >= 0 ? pos : neg, b = a + v;
        if (v >= 0) pos = b; else neg = b;
        g += `<rect x="${x}" width="${w}" y="${Math.min(Y(a), Y(b))}" height="${Math.max(0.5, Math.abs(Y(a) - Y(b)))}" fill="${s.color}"><title>${esc(s.name)} · ${esc(lab)}: ${fmt(v)}</title></rect>`;
      });
    } else {
      const sw = w / series.length;
      series.forEach((s, k) => {
        const v = s.values[i]; if (!isNum(v)) return;
        const last = (opts.dashedLast && i === labels.length - 1) || (isNum(opts.estFrom) && i >= opts.estFrom);
        g += `<rect x="${x + k * sw}" width="${Math.max(1, sw - (series.length > 1 ? 2 : 0))}" y="${Math.min(Y(0), Y(v))}" height="${Math.max(0.5, Math.abs(Y(v) - Y(0)))}" fill="${(opts.fills && opts.fills[i]) || s.color}" rx="1.5" ${last ? `stroke="${s.color}" stroke-width="1.5" stroke-dasharray="4 3"` : ""}><title>${esc(s.name)} · ${esc(lab)}: ${fmt(v)}</title></rect>`;
      });
      if (opts.marks && isNum(opts.marks[i])) g += `<line x1="${x - 4}" x2="${x + w + 4}" y1="${Y(opts.marks[i])}" y2="${Y(opts.marks[i])}" stroke="var(--ink)" stroke-width="2.2" stroke-dasharray="5 3"><title>${esc(opts.markName || "Estimate")} · ${esc(lab)}: ${fmt(opts.marks[i])}</title></line>`;
      if (opts.marks2 && isNum(opts.marks2[i])) g += `<line x1="${x - 4}" x2="${x + w + 4}" y1="${Y(opts.marks2[i])}" y2="${Y(opts.marks2[i])}" stroke="var(--c2)" stroke-width="2.6" stroke-dasharray="2 3"><title>${esc(opts.mark2Name || "Model")} · ${esc(lab)}: ${fmt(opts.marks2[i])}</title></line>`;
    }
    const hasTxt = opts.annotText && opts.annotText[i];
    if (hasTxt || (opts.annot && isNum(opts.annot[i]))) {
      const top = stacked ? Y(series.reduce((t, s) => t + Math.max(0, n0(s.values[i])), 0)) : Y(Math.max(...series.map(s => n0(s.values[i])), opts.marks && isNum(opts.marks[i]) ? opts.marks[i] : -Infinity, opts.marks2 && isNum(opts.marks2[i]) ? opts.marks2[i] : -Infinity));
      if (hasTxt) {
        const lines = [].concat(opts.annotText[i]);
        lines.forEach((ln, k) => { g += `<text x="${x + w / 2}" y="${top - 6 - (lines.length - 1 - k) * 12}" text-anchor="middle" style="fill:var(${ln.tone === "pos" ? "--pos" : ln.tone === "neg" ? "--neg" : "--muted"});font-weight:${ln.bold ? 600 : 500};font-size:9.8px">${esc(ln.t)}</text>`; });
      } else g += `<text x="${x + w / 2}" y="${top - 5}" text-anchor="middle" style="fill:var(${opts.annot[i] >= 0 ? "--pos" : "--neg"});font-weight:500">${pct(opts.annot[i], 0)}</text>`;
    }
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
    if (opts.clickKeys && opts.clickKeys[i]) g += `<rect class="colhit" data-evt="${esc(opts.clickKeys[i])}" x="${x - gap / 2}" y="${M.t}" width="${bw}" height="${H - M.t - M.b + 18}" fill="transparent" role="button" tabindex="0" aria-label="Show how the stock traded around the ${esc(lab)} report"><title>${esc(lab)}: click to see the price ±30 days around the report</title></rect>`;
  });
  if (y0 < 0) g += `<line class="zero" x1="${M.l}" x2="${W - M.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || "bar chart")}">${g}</svg>`;
}

function lineChart(labels, series, opts = {}) {
  const fmt = opts.fmt || (v => pctPlain(v, 0));
  const vals = series.flatMap(s => s.values.filter(isNum));
  if (!vals.length) return `<p class="note">No data.</p>`;
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (opts.zero) mn = Math.min(0, mn);
  const pad = (mx - mn) * 0.1 || 0.01;
  const ticks = niceTicks(mn - (opts.zero ? 0 : pad), mx + pad);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const Y = v => M.t + ih - (v - y0) / (y1 - y0) * ih;
  const X = i => M.l + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1));
  let g = ticks.map(t => `<line class="gl" x1="${M.l}" x2="${W - M.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${M.l - 8}" y="${Y(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`).join("");
  if (y0 < 0 && y1 > 0) g += `<line class="zero" x1="${M.l}" x2="${W - M.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  labels.forEach((l, i) => g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`);
  series.forEach(s => {
    let d = "", started = false;
    s.values.forEach((v, i) => { if (!isNum(v)) { started = false; return; } d += (started ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); started = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>`;
    s.values.forEach((v, i) => { if (isNum(v)) g += `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === s.values.length - 1 ? 4 : 2.6}" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(s.name)} · ${esc(labels[i])}: ${fmt(v)}</title></circle>`; });
    const li = s.values.length - 1; if (isNum(s.values[li])) g += `<text x="${X(li) - 6}" y="${Y(s.values[li]) - 9}" text-anchor="end" style="fill:${s.color};font-weight:500">${fmt(s.values[li])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || "line chart")}">${g}</svg>`;
}
const legend = series => `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
const PAL = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];

class ApiError extends Error { constructor(m, s) { super(m); this.status = s; } }
const API_CACHE = new Map();
function api(path, params = {}) {
  const key = path + "?" + new URLSearchParams(params).toString() + "#" + getKey();
  if (!/^search/.test(path) && API_CACHE.has(key)) return API_CACHE.get(key);
  const pr = apiFetch(path, params);
  if (!/^search/.test(path)) { API_CACHE.set(key, pr); pr.catch(() => API_CACHE.delete(key)); }
  return pr;
}
async function apiFetch(path, params) {
  const u = new URL(BASE + path);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set("apikey", getKey());
  let r;
  try { r = await fetch(u); } catch (e) { throw new ApiError("Couldn't reach Financial Modeling Prep. Check your internet connection.", 0); }
  const text = await r.text();
  let j; try { j = JSON.parse(text); } catch (e) { throw new ApiError(text.slice(0, 220) || `HTTP ${r.status}`, r.status); }
  if (!r.ok || (j && !Array.isArray(j) && (j["Error Message"] || j.error || j.message))) throw new ApiError(j["Error Message"] || j.error || j.message || `HTTP ${r.status}`, r.status);
  return j;
}

async function loadSegments(endpoint, symbol) {
  let qNote = "";
  try { const q = await api(endpoint, { symbol, period: "quarter" }); const s = normSegments(q, "quarter"); if (s && s.rows.length >= 2) return s; qNote = "No quarterly segment figures were returned for this company."; }
  catch (e) { qNote = e.message; }
  try { const a = await api(endpoint, { symbol }); const s = normSegments(a, "annual"); if (s) s.qNote = qNote; return s; } catch (e) { return null; }
}

async function load(symbol) {
  symbol = symbol.trim().toUpperCase();
  if (!symbol) return;
  store.set("lastTicker", symbol);
  document.getElementById("tickerInput").value = symbol;
  const app = document.getElementById("app");
  app.innerHTML = `<div class="status">Loading ${esc(symbol)}…</div><div class="skel"></div><div class="skel"></div>`;
  try {
    const [profile, inc, bs, cf] = await Promise.all([
      api("profile", { symbol }).then(x => x[0] || {}).catch(() => ({})),
      api("income-statement", { symbol, period: "quarter", limit: FETCH_Q }),
      api("balance-sheet-statement", { symbol, period: "quarter", limit: FETCH_Q }),
      api("cash-flow-statement", { symbol, period: "quarter", limit: FETCH_Q })
    ]);
    if (!inc.length) throw new ApiError(`No financial statements found for ${symbol}. Check the ticker, or use the search to pick the listing.`, 404);
    const [seg, geo, earnings, est, pt] = await Promise.all([
      loadSegments("revenue-product-segmentation", symbol), loadSegments("revenue-geographic-segmentation", symbol),
      api("earnings", { symbol, limit: 12 }).catch(() => []),
      api("analyst-estimates", { symbol, period: "annual", limit: 10 }).catch(() => []),
      api("price-target-consensus", { symbol }).then(x => x[0] || null).catch(() => null)
    ]);
    const asc = a => [...a].sort((x, y) => x.date < y.date ? -1 : 1);
    const d = { symbol, profile, inc: enrichIncome(asc(inc)), bs: asc(bs), cf: asc(cf), seg, geo, earnings, est, pt };
    d.bs.forEach(r => r.label = qLabel(r)); d.cf.forEach(r => r.label = qLabel(r));
    d.currency = d.inc[d.inc.length - 1].reportedCurrency || profile.currency || "USD";
    STATE.segSel = {}; STATE.px = null;
    d.fc = buildForecast(d);
    render(d);
  } catch (e) {
    const keyHint = (e.status === 401 || e.status === 403 || /api key|apikey|Invalid/i.test(e.message)) ? " Check your API key under “API key”." : (e.status === 402 || /premium|subscription|plan/i.test(e.message)) ? " This data needs a higher Financial Modeling Prep plan." : "";
    app.innerHTML = `<div class="status err"><b>Couldn't load ${esc(symbol)}.</b> ${esc(e.message)}${keyHint}</div>`;
  }
}
